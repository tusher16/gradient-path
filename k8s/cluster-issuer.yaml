# ─────────────────────────────────────────────────────────────────────────────
# CLUSTER-SCOPED SHARED INFRASTRUCTURE — not owned by Gradient Path.
#
# Canonical home per the homelab master plan is:
#     tusher16/homelab → apps/infra/cluster-issuer.yaml
# That repo does not exist on disk yet (Phase 11), so this copy lives here as a
# stopgap so the live cluster state has a source of truth. Move it when the
# homelab repo is created, and delete this file.
#
# This ClusterIssuer is shared by every app on the cluster (policypulse,
# the tusher16.com / safinakhan.com landing pages, flashdeutsch, etc.).
# Editing it affects all of them — only ever ADD solvers, never reorder or
# alter the existing two.
#
# Why the third solver exists:
#   Each solver is gated by selector.dnsZones. A domain with no matching
#   selector gets NO solver at all, and cert-manager fails the Order with
#   "no configured challenge solvers can be used for this challenge" before
#   any Challenge object is created. gradientpath.site is a third Cloudflare
#   zone and needed its own entry. It reuses cloudflare-api-token-secret
#   (the cert-manager-homelab token, scoped to All zones).
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: tusher16@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      # Zone 1 — tusher16.com
      - dns01:
          cloudflare:
            email: tusher16@gmail.com
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - tusher16.com

      # Zone 2 — safinakhan.com
      - dns01:
          cloudflare:
            email: safina7894@gmail.com
            apiTokenSecretRef:
              name: cloudflare-api-token-safina
              key: api-token
        selector:
          dnsZones:
            - safinakhan.com

      # Zone 3 — gradientpath.site (added Aug 2026 for the Gradient Path app)
      - dns01:
          cloudflare:
            email: tusher16@gmail.com
            apiTokenSecretRef:
              name: cloudflare-api-token-secret
              key: api-token
        selector:
          dnsZones:
            - gradientpath.site
