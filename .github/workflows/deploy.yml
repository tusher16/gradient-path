name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tusher16/gradient-path:latest
            ghcr.io/tusher16/gradient-path:${{ github.sha }}

      - name: Roll out to K3s
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP }}
          username: tusher16
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # k3s ships kubectl as a symlink to the k3s binary, which defaults
            # KUBECONFIG to /etc/rancher/k3s/k3s.yaml (root:root 0600) instead of
            # falling back to ~/.kube/config the way upstream kubectl does.
            # Point it at tusher16's own readable copy explicitly.
            export KUBECONFIG=$HOME/.kube/config
            kubectl set image deployment/gradient-path \
              gradient-path=ghcr.io/tusher16/gradient-path:${{ github.sha }} \
              -n apps
            kubectl rollout status deployment/gradient-path -n apps --timeout=120s
