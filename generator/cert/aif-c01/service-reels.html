<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AWS AI Service Reels &mdash; Gradient Path</title>
<meta name="description" content="Every AWS service on the AI Practitioner exam (AIF-C01) as a short narrated reel: what goes in, what comes out, the words a question uses, the look-alike, and the line to remember. Free, no signup.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%221%22%20x2%3D%221%22%20y2%3D%220%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%23C11E5C%22%2F%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%230C7A70%22%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23131C1A%22%2F%3E%3Cpath%20d%3D%22M8%2025C8%2015%2024%2017%2024%207%22%20fill%3D%22none%22%20stroke%3D%22url%28%23g%29%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<script>try{var t=localStorage.getItem('gradient_path_theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
/* tokens, diagram and feed styles are copied in by build.js, never edited here */
/*__TOKENS__*/
/*__MOTION__*/
/*__REELCSS__*/
/* what only the service scenes need */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.gl,.gg{fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round}
.gl{stroke-width:1.8} .gg{stroke-width:1.25}
.gl.off{color:var(--line)} .gl.here{color:var(--signal)} .gl.here.big{stroke-width:2.2}
.gg.in{color:var(--signal)} .gg.out{color:var(--memory)} .gg.mach{color:var(--memory); stroke-width:1.1}
.mo text.lbx{font-family:var(--mono); font-size:14px; fill:var(--meta)}
.mo text.chip{font-family:var(--mono); fill:var(--ink)}
.mo .head{fill:none; stroke:var(--ink-2); stroke-width:4.5}
.mo .sense{fill:none; stroke:var(--signal); stroke-width:8; stroke-linecap:round; stroke-linejoin:round}
.mo .hl{fill:none; stroke:var(--signal); stroke-width:3}
.mo .pu{fill:none; stroke:var(--memory); stroke-width:2; transform-box:fill-box; transform-origin:center}
.mo .strike{stroke-width:3}
/* a pulse carries the input into the machine and the output out of it */
.card .mo .a.tk.on{animation:svTk .85s ease-in-out var(--o,0s) both}
.card .mo .a.pu.on{animation:svPu .65s ease-out var(--o,0s) both}
.card .mo .a.tk.now,.card .mo .a.pu.now{animation:none; opacity:0}
@keyframes svTk{0%{opacity:0; transform:translateX(0)} 20%,80%{opacity:1} 100%{opacity:0; transform:translateX(var(--dx))}}
@keyframes svPu{0%{opacity:.9; transform:scale(1)} 100%{opacity:0; transform:scale(1.18)}}
/* each output picture repeats a small move of its own, three times, once it has drawn */
.sig{transform-box:fill-box; transform-origin:center}
.card .mo .a.on .sig{animation:svBob 1.1s ease-in-out calc(var(--o,0s) + .8s) 3}
.card .mo .a.on .sig.ring{animation-name:svRing}
.card .mo .a.on .sig.spin{animation-name:svSpin; animation-timing-function:linear}
.card .mo .a.on .sig.scan{animation-name:svScan}
.card .mo .a.on .sig.turn{animation-name:svTurn}
.card .mo .a.on .sig.pop{animation-name:svPop}
.card .mo .a.on .sig.flow{animation-name:svFlow}
.card .mo .a.on .sig.rise{animation-name:svRise}
.card .mo .a.now .sig{animation:none}
@keyframes svBob{50%{transform:translateY(-2.5px)}}
@keyframes svRing{25%{transform:rotate(11deg)} 75%{transform:rotate(-11deg)}}
@keyframes svSpin{to{transform:rotate(360deg)}}
@keyframes svScan{33%{transform:translate(-2.5px,-1.5px)} 66%{transform:translate(2.5px,1.5px)}}
@keyframes svTurn{50%{transform:rotate(22deg)}}
@keyframes svPop{50%{transform:scale(1.12)}}
@keyframes svFlow{50%{transform:translateX(2.5px)}}
@keyframes svRise{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){
  .mo .a.tk,.mo .a.pu{display:none}
  .card .mo .a.on .sig{animation:none}
}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><!--__SYMBOLS__--></defs></svg>

<header class="bar"><div class="bar-in">
  <a class="home" href="/aws-ai-practitioner-services"><b class="long">AWS AI Practitioner <span>/</span></b> <span>Service reels</span></a>
  <button class="tog" type="button" id="sound" aria-pressed="false">Sound</button>
  <button class="tog" type="button" id="auto" aria-pressed="true">Auto next</button>
  <button class="tog" type="button" id="theme">Theme</button>
</div></header>

<main class="feed" id="feed" aria-label="Service reels"></main>
<div class="toast" id="toast" role="status"></div>

<script>
const DATA = /*__DATA__*/null;
(function(){
'use strict';
/*__HELPERS__*/
const ZONES = DATA.zones, COUNT = T.filter(t => t.kind === 'service').length;

let html = `<section class="reel" id="intro"><div class="card plain">
  <h1>${COUNT} AWS services, one town</h1>
  <p>One reel per service: what goes in, what comes out, the words a question uses, the look-alike, then the line to remember. About 20 seconds each. Swipe up, or press the down arrow, for the next.</p>
  <div class="row"><button class="btn go" type="button" id="start-sound">Start with sound</button><button class="btn" type="button" id="start-muted">Watch muted</button></div>
  <ol class="doms">${ZONES.map((z, i) => `<li><a href="#r-z-${z.id}" data-jump="z-${z.id}"><span class="n">${i + 1}</span><span>${esc(z.place)}</span><span class="c">${z.n} reels</span></a></li>`).join('')}</ol>
  <p class="note">Narration is recorded with <a href="https://huggingface.co/hexgrad/Kokoro-82M">Kokoro-82M</a>; if a clip is missing, your browser&rsquo;s own voice reads that part. For the same facts on one page, open the <a href="/aws-ai-practitioner-services">cheat sheet</a>.</p>
</div></section>`;
T.forEach((t, i) => {
  const m = DATA.motion[t.id], z = ZONES[t.z], place = t.kind === 'place';
  const more = place ? `<a class="btn" href="/aws-ai-practitioner-services#${z.id}">Open on the sheet</a>` : `<a class="btn" href="/aws-ai-practitioner-services#s-${t.id}">See the card</a>`;
  html += `<article class="reel" id="r-${t.id}" data-i="${i}" aria-label="${esc(t.title)}"><div class="card">
    <div class="meta"><span>${place ? 'Next stop' : esc(z.place)}</span><span class="num">${place ? `Place ${t.z + 1} of ${ZONES.length}` : String(t.n).padStart(2, '0') + ' / ' + COUNT}</span></div>
    <h2>${esc(t.title)}</h2>
    <figure class="mo"><svg viewBox="0 0 440 ${m.h}" aria-hidden="true" focusable="false">${m.svg}</svg><figcaption class="sr">${esc(t.sr)}</figcaption></figure>
    <div class="seg" aria-hidden="true">${m.steps.map(() => '<i></i>').join('')}<i></i></div>
    <p class="cap" aria-live="polite"></p>
    <p class="hk"></p>
    <div class="acts"><button class="btn" type="button" data-act="pause">Pause</button><button class="btn" type="button" data-act="replay">Replay</button>
      ${more}<button class="btn" type="button" data-act="link">Copy link</button></div>
  </div></article>`;
});
html += `<section class="reel" id="end"><div class="card plain">
  <h1>That&rsquo;s the whole town.</h1>
  <p>Now see how much stuck: the cheat sheet&rsquo;s Hide names mode shows each job and asks you for the service.</p>
  <div class="row"><a class="btn go" href="/aws-ai-practitioner-services">Test yourself</a><a class="btn" href="/aws-ai-practitioner#console">Practice questions</a><button class="btn" type="button" data-jump="intro">Back to the start</button></div>
</div></section>`;
$('#feed').innerHTML = html;
/*__PLAYER__*/
})();
</script>
</body></html>
