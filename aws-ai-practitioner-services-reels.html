<style>
/* tokens, diagram and feed styles are copied in by build.js, never edited here */
:root{
  --ground:#EFF3F2; --surface:#FFFFFF; --sunk:#E6ECEA;
  --line:#D2DBD9; --line-soft:#E3E9E8;
  --ink:#131C1A; --ink-2:#3B4B48; --muted:#687975;
  /* --muted is 3.8-4.1:1 off white; --meta clears 4.5:1 on ground, sunk and both tints */
  --meta:#586864;
  --signal:#C11E5C; --signal-soft:#FBE6EE;
  --memory:#0C7A70; --memory-soft:#DCF0ED;
  --shadow:0 1px 2px rgba(19,28,26,.05), 0 10px 26px -18px rgba(19,28,26,.35);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0C1211; --surface:#141C1B; --sunk:#101817;
  --line:#283432; --line-soft:#1E2827;
  --ink:#E7EEEC; --ink-2:#B6C4C1; --muted:#84948F; --meta:#84948F;
  --signal:#FF6A9C; --signal-soft:#33141F;
  --memory:#42D3BF; --memory-soft:#0C2B28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0C1211; --surface:#141C1B; --sunk:#101817;
  --line:#283432; --line-soft:#1E2827;
  --ink:#E7EEEC; --ink-2:#B6C4C1; --muted:#84948F; --meta:#84948F;
  --signal:#FF6A9C; --signal-soft:#33141F;
  --memory:#42D3BF; --memory-soft:#0C2B28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
/* motion explainers: one authored diagram per topic. At rest the
   finished diagram shows; .run replays it step by step, each step --step apart */
.mo{margin:0 0 20px; padding:14px 16px 12px; background:var(--sunk); border-radius:14px; --step:1.8s}
.mo svg{display:block; width:100%; height:auto; max-height:320px; overflow:visible}
.mo .bx{fill:var(--surface); stroke:var(--line); stroke-width:1.5}
.mo .bx.m{fill:var(--memory-soft); stroke:var(--memory)}
.mo .bx.s{fill:var(--signal-soft); stroke:var(--signal)}
.mo .bx.off{fill:none; stroke:var(--ink-2); stroke-dasharray:4 4}
.mo .ln{fill:none; stroke:var(--ink-2); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.mo .ln.m{stroke:var(--memory)} .mo .ln.s{stroke:var(--signal)} .mo .ln.dash{stroke-dasharray:5 5}
.mo .dot{fill:var(--ink-2)} .mo .dot.m{fill:var(--memory)} .mo .dot.s{fill:var(--signal)}
.mo .pl{fill:var(--line)}
.mo text{font-family:var(--body); font-size:15px; fill:var(--ink-2)}
.mo text.lb{font-size:16px; font-weight:600; fill:var(--ink)}
.mo text.lb.m{fill:var(--memory)} .mo text.lb.s{fill:var(--signal)}
.mo text.hd{font-family:var(--display); font-size:19px; font-weight:700; fill:var(--ink)}
.mo .mid{text-anchor:middle} .mo .end{text-anchor:end}
.mo .g{transform-box:fill-box; transform-origin:center}
.mo.run .a{animation:moIn var(--dur,.5s) cubic-bezier(.16,1,.3,1) calc(var(--t,0) * var(--step) + var(--o,0s)) both}
.mo.run .a.g{animation-name:moGrow}
.mo.run .a.d{stroke-dasharray:1; animation-name:moDraw; animation-timing-function:cubic-bezier(.33,0,.2,1)}
@keyframes moIn{from{opacity:0; transform:translate(var(--x,0px),var(--y,8px))}}
@keyframes moGrow{from{opacity:0; transform:scale(.55)}}
@keyframes moDraw{from{stroke-dashoffset:1}}
.mocap{margin:12px 0 0; padding:0; list-style:none; display:grid; gap:6px; font-size:.92rem; color:var(--ink-2); counter-reset:mo}
.mocap li{display:grid; grid-template-columns:22px minmax(0,1fr); gap:0 6px; counter-increment:mo}
.mocap li::before{content:counter(mo); font-family:var(--mono); font-size:.78rem; color:var(--memory); padding-top:2px}
.mo.run .mocap li{animation:moCap .5s ease-out calc(var(--t) * var(--step)) both}
@keyframes moCap{from{opacity:.25}}
.mo .mofoot{display:flex; justify-content:flex-end; margin-top:8px}
.mo .mofoot .btn{font-size:.8rem; padding:6px 12px}
@media (prefers-reduced-motion:reduce){.mo.run .a, .mo.run .mocap li{animation:none} .mo .mofoot{display:none}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden}
::selection{background:var(--signal-soft); color:var(--ink)}
a{color:inherit; text-underline-offset:3px; text-decoration-color:var(--line)}
a:hover{text-decoration-color:var(--signal)}
h1,h2{font-family:var(--display); margin:0; letter-spacing:-.015em; text-wrap:balance; font-weight:700}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--signal); outline-offset:3px; border-radius:6px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

.bar{position:fixed; inset:0 0 auto; z-index:5; height:52px; background:var(--surface); border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px; height:100%; margin:0 auto; padding:0 20px; display:flex; align-items:center; gap:8px}
.home{font-family:var(--display); font-weight:700; text-decoration:none; font-size:1rem; margin-right:auto; white-space:nowrap}
.home b{font-weight:700} .home .short{display:none}
.home span{color:var(--meta); font-weight:500}
.tog{font-family:var(--mono); font-size:.74rem; border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 11px; white-space:nowrap}
.tog:hover{border-color:var(--ink-2)}
.tog[aria-pressed="true"]{border-color:var(--memory); color:var(--memory)}
.tog:disabled{opacity:.45; cursor:not-allowed}
.btn{font-family:var(--mono); font-size:.8rem; font-weight:600; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); padding:9px 15px; text-decoration:none; display:inline-flex; align-items:center; min-height:40px}
.btn:hover{border-color:var(--ink-2)}
.btn.go{background:var(--memory); border-color:var(--memory); color:var(--surface)}

/* the feed: one reel per screen, snapping */
.feed{position:fixed; inset:52px 0 0; overflow-y:auto; scroll-snap-type:y mandatory; overscroll-behavior:contain; scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{height:calc(100dvh - 52px); scroll-snap-align:start; scroll-snap-stop:always; display:grid; place-items:center; padding:14px 16px}
.card{width:min(100%, 470px, calc((100dvh - 80px) * 9 / 16)); height:min(100%, 840px); background:var(--surface);
  border:1px solid var(--line); border-radius:16px; padding:18px 18px 14px; display:flex; flex-direction:column; gap:10px; overflow:hidden}
.meta{display:flex; justify-content:space-between; gap:12px; font-family:var(--mono); font-size:.72rem; color:var(--meta); white-space:nowrap}
.meta span:first-child{overflow:hidden; text-overflow:ellipsis}
.card h2{font-size:clamp(1.25rem, 4.4vw, 1.5rem); line-height:1.2}
.card .mo{margin:0; padding:12px; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center}
.card .mo svg{max-height:100%; width:100%}
/* reels drive the steps from script: an element shows when its step is reached */
.card .mo .a{opacity:0}
.card .mo .a.on{opacity:1; animation:moIn var(--dur,.5s) cubic-bezier(.16,1,.3,1) var(--o,0s) both}
.card .mo .a.g.on{animation-name:moGrow}
.card .mo .a.d.on{stroke-dasharray:1; animation-name:moDraw; animation-timing-function:cubic-bezier(.33,0,.2,1)}
.card .mo .a.now{animation:none}
.seg{display:flex; gap:4px}
.seg i{flex:1; height:3px; border-radius:2px; background:var(--line); transition:background .3s ease-out}
.seg i.on{background:var(--memory)}
.cap{margin:0; font-size:1.06rem; line-height:1.5; min-height:4.5em; color:var(--ink)}
.hk{margin:0; font-family:var(--display); font-weight:700; font-size:1.02rem; line-height:1.35; color:var(--memory); min-height:2.7em}
.hk:empty{visibility:hidden}
.acts{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.acts .btn{padding:7px 13px; min-height:36px; font-size:.76rem}

/* intro and end cards */
.card.plain{justify-content:center; gap:16px}
.card.plain h1{font-size:clamp(1.9rem, 7vw, 2.4rem); line-height:1.08}
.card.plain p{margin:0; color:var(--ink-2)}
.card.plain .row{display:flex; flex-wrap:wrap; gap:10px}
.doms{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.doms li{border-bottom:1px solid var(--line)}
.doms a{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; padding:9px 2px; text-decoration:none; font-size:.92rem}
.doms .n{font-family:var(--mono); color:var(--memory); font-size:.8rem; padding-top:2px}
.doms .c{font-family:var(--mono); color:var(--meta); font-size:.74rem; padding-top:3px}
.note{font-size:.82rem; color:var(--meta) !important}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(14px); background:var(--ink); color:var(--ground);
  padding:9px 15px; border-radius:999px; font-size:.86rem; opacity:0; transition:opacity .2s ease-out, transform .2s ease-out; pointer-events:none; z-index:9}
.toast.on{opacity:1; transform:translateX(-50%)}
@media (max-width:640px){
  .bar-in{padding:0 12px; gap:6px}
  .home .long{display:none} .home .short{display:inline}
  .tog{padding:6px 9px; font-size:.7rem}
  .reel{padding:0}
  .card{width:100%; height:100%; border-radius:0; border:0; padding:16px 16px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important} .card .mo .a.on{animation:none}}
/* what only the service scenes need */
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap}
.gl,.gg{fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round}
.gl{stroke-width:1.8} .gg{stroke-width:1.25}
.gl.off{color:var(--line)} .gl.here{color:var(--signal)} .gl.here.big{stroke-width:2.2}
.gg.in{color:var(--signal)} .gg.out{color:var(--memory)} .gg.mach{color:var(--memory); stroke-width:1.1}
.mo text.lbx{font-family:var(--mono); font-size:14px; fill:var(--meta)}
.mo text.chip{font-family:var(--mono); fill:var(--ink)}
.mo .head{fill:none; stroke:var(--ink-2); stroke-width:4.5}
.mo .sense{fill:none; stroke:var(--signal); stroke-width:8; stroke-linecap:round; stroke-linejoin:round}
.mo .hl{fill:none; stroke:var(--signal); stroke-width:3}
.mo .pu{fill:none; stroke:var(--memory); stroke-width:2; transform-box:fill-box; transform-origin:center}
.mo .strike{stroke-width:3}
/* a pulse carries the input into the machine and the output out of it */
.card .mo .a.tk.on{animation:svTk .85s ease-in-out var(--o,0s) both}
.card .mo .a.pu.on{animation:svPu .65s ease-out var(--o,0s) both}
.card .mo .a.tk.now,.card .mo .a.pu.now{animation:none; opacity:0}
@keyframes svTk{0%{opacity:0; transform:translateX(0)} 20%,80%{opacity:1} 100%{opacity:0; transform:translateX(var(--dx))}}
@keyframes svPu{0%{opacity:.9; transform:scale(1)} 100%{opacity:0; transform:scale(1.18)}}
/* each output picture repeats a small move of its own, three times, once it has drawn */
.sig{transform-box:fill-box; transform-origin:center}
.card .mo .a.on .sig{animation:svBob 1.1s ease-in-out calc(var(--o,0s) + .8s) 3}
.card .mo .a.on .sig.ring{animation-name:svRing}
.card .mo .a.on .sig.spin{animation-name:svSpin; animation-timing-function:linear}
.card .mo .a.on .sig.scan{animation-name:svScan}
.card .mo .a.on .sig.turn{animation-name:svTurn}
.card .mo .a.on .sig.pop{animation-name:svPop}
.card .mo .a.on .sig.flow{animation-name:svFlow}
.card .mo .a.on .sig.rise{animation-name:svRise}
.card .mo .a.now .sig{animation:none}
@keyframes svBob{50%{transform:translateY(-2.5px)}}
@keyframes svRing{25%{transform:rotate(11deg)} 75%{transform:rotate(-11deg)}}
@keyframes svSpin{to{transform:rotate(360deg)}}
@keyframes svScan{33%{transform:translate(-2.5px,-1.5px)} 66%{transform:translate(2.5px,1.5px)}}
@keyframes svTurn{50%{transform:rotate(22deg)}}
@keyframes svPop{50%{transform:scale(1.12)}}
@keyframes svFlow{50%{transform:translateX(2.5px)}}
@keyframes svRise{50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){
  .mo .a.tk,.mo .a.pu{display:none}
  .card .mo .a.on .sig{animation:none}
}
</style></head>

>\u003c/g>"}},"segs":[["The person. Ready-made senses. No ML skills, just call the API.","8 services live here."],["Amazon Rekognition, part of the person. Sees images and video.","The question says: faces, objects, unsafe images, video moderation.","Not Amazon Textract. Text on documents goes to Textract.","Remember. The eyes. Recognises what it looks at."],["Amazon Transcribe, part of the person. Speech into text.","The question says: call recordings, subtitles, speaker labels.","Not Amazon Polly. Polly goes the other way: text into speech.","Remember. The ears. A transcript is what you get."],["Amazon Polly, part of the person. Text into speech.","The question says: read aloud, natural voice, SSML.","Not Amazon Transcribe. Transcribe goes the other way: speech into text.","Remember. The mouth. Polly the parrot talks."],["Amazon Lex, part of the person. Builds chatbots.","The question says: intents, slots, voice or text bot.","Not Amazon Polly. Polly only speaks; it understands nothing.","Remember. The conversation. Lex works out what you want."],["Amazon Comprehend, part of the person. Understands text you already have.","The question says: sentiment, entities, key phrases, PII in text.","Not Amazon Textract. Text still on paper needs Textract first.","Remember. The brain. Comprehension of text."],["Amazon Textract, part of the person. Pulls text off scanned paper.","The question says: scanned forms, invoices, tables, OCR.","Not Amazon Comprehend. Comprehend understands text; this one only extracts it.","Remember. The reading glasses. Extracts text from paper."],["Amazon Translate, part of the person. One language into another.","The question says: localise, multilingual, custom terminology.","Remember. The tongue. Does exactly what the name says."],["Amazon Personalize, part of the person. Recommends what you will like.","The question says: recommendations from user-item interactions.","Remember. The nose. It sniffs out your taste."],["The rental shop. Rent a foundation model by the token. No servers.","9 services live here."],["Amazon Bedrock, in the rental shop. Foundation models behind one API.","The question says: serverless, use an FM, least operational work.","Not Amazon SageMaker AI. SageMaker AI is for building and hosting your own model.","Remember. Rent a model by the token."],["Amazon Nova, in the rental shop. Amazon’s own foundation models.","The question says: Amazon-built FM: text, image, video, speech.","Remember. Nova Lite writes, Nova Canvas paints."],["Amazon Titan Text Embeddings, in the rental shop. Turns text into vectors.","The question says: embedding model for semantic search.","Remember. Meaning becomes numbers."],["Bedrock Knowledge Bases, in the rental shop. Managed RAG with citations.","The question says: answer from our documents, cite sources, sync.","Not Bedrock fine-tuning. Facts that change need RAG, not new weights.","Remember. An open-book exam for the model."],["Bedrock Guardrails, in the rental shop. Filters what goes in and out.","The question says: denied topics, word filters, PII masking, grounding check.","Not AWS IAM. IAM decides who may call the model.","Remember. Decides what may be said."],["Bedrock Model Evaluation, in the rental shop. Scores and compares models.","The question says: automatic, human or LLM-as-a-judge review.","Remember. The exam board for models."],["Bedrock Prompt Management, in the rental shop. Saves and versions prompts.","The question says: reusable prompt templates, versions, variables.","Remember. A recipe book for prompts."],["Bedrock Provisioned Throughput, in the rental shop. Guaranteed model capacity.","The question says: steady high traffic, model units, 1 or 6 months.","Remember. The leased car. On-demand is the taxi meter."],["Bedrock fine-tuning, in the rental shop. Teaches a model your style.","The question says: labelled prompt-response pairs, tone, format.","Not Bedrock Knowledge Bases. Changing facts belong in a knowledge base.","Remember. Changes the weights. Behaviour, not fresh facts."],["The workshop. SageMaker. Build, train and run your own model.","14 services live here."],["Amazon SageMaker AI, in the workshop. Build, train and host your own.","The question says: custom model, training jobs, full control.","Not Amazon Bedrock. Bedrock is for using a ready FM with no servers.","Remember. The whole workshop. You own the model."],["SageMaker JumpStart, in the workshop. A shelf of pre-trained models.","The question says: pre-trained model on your own endpoint.","Not Amazon Bedrock. Bedrock has no endpoint for you to run.","Remember. The workshop’s model shelf."],["SageMaker Canvas, in the workshop. Build a model without code.","The question says: business analyst, no-code predictions.","Remember. Paint a model. No code."],["SageMaker Data Wrangler, in the workshop. Prepares data for ML.","The question says: clean and transform data for training, visually.","Remember. Wrangles messy data into line."],["SageMaker Feature Store, in the workshop. Keeps features for reuse.","The question says: share inputs across teams, training and serving.","Remember. A pantry of ready ingredients."],["SageMaker Ground Truth, in the workshop. Humans label training data.","The question says: data labelling before training.","Not Amazon Augmented AI. A2I reviews live predictions, after training.","Remember. People write the answer key."],["Amazon Augmented AI, in the workshop. Humans check live predictions.","The question says: human review of low-confidence results.","Not SageMaker Ground Truth. Ground Truth labels training data, before training.","Remember. A human backstop on real output."],["SageMaker Pipelines, in the workshop. Automates the ML workflow.","The question says: CI/CD for ML, repeatable steps.","Remember. The assembly line."],["SageMaker Experiments, in the workshop. Tracks training runs.","The question says: compare runs, record parameters.","Remember. The lab notebook."],["SageMaker Model Registry, in const clipsOf = (r) => DATA.audio[T[+r.dataset.i].id] || [];
const firstClip = Object.values(DATA.audio).flat().find(Boolean) || null;
if (!canSpeak && !firstClip) { $('#sound').disabled = true; $('#sound').title = 'This browser cannot read aloud'; $('#start-sound').hidden = true; }
function prefetch(r){ if (r && r.matches('article.reel')) clipsOf(r).forEach(u => { if (u) { const a = new Audio(); a.preload = 'auto'; a.src = u; } }); }
const readTime = (s) => Math.min(7500, Math.max(2600, s.length * 58));
const lastStep = (r) => DATA.motion[T[+r.dataset.i].id].steps.length - 1;
function speak(text, fin){
  if (!canSpeak) { sleep(readTime(text)).then(fin); return; }
  const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.rate = 1.02; u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
}
// a recorded clip when there is one, the browser's voice when not, silence when sound is off;
// a timer backs up every path, because some engines never fire their end event
function say(text, tok, src){
  if (!P.sound) return sleep(readTime(text));
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; player.onended = player.onerror = null; res(); } };
    setTimeout(fin, readTime(text) * 2 + 4000);
    if (src) {
      player.onended = fin; player.onerror = () => { player.onerror = null; speak(text, fin); };
      player.src = src; player.play().catch(() => speak(text, fin));
    } else speak(text, fin);
  }).then(() => sleep(tok === P.tok ? 320 : 0));
}
function show(r, k, instant){
  (steps.get(r)[k] || []).forEach(el => { el.classList.add('on'); el.classList.toggle('now', !!instant); });
  $$('.seg i', r).forEach((s, j) => s.classList.toggle('on', j <= k));
}
function reset(r){
  $$('.a', r).forEach(el => el.classList.remove('on', 'now'));
  void r.getBoundingClientRect();   // make the browser see the removal, so Replay restarts the animations
  $$('.seg i', r).forEach(s => s.classList.remove('on'));
  $('.cap', r).textContent = ''; $('.hk', r).textContent = '';
}
function halt(){ P.tok++; if (canSpeak) speechSynthesis.cancel(); player.onended = player.onerror = null; player.pause(); }
async function play(r, from = 0){
  halt(); const tok = P.tok; P.cur = r; P.paused = false; P.at = from;
  $('[data-act="pause"]', r).textContent = 'Pause';
  const t = T[+r.dataset.i], m = DATA.motion[t.id];
  reset(r);
  for (let k = 0; k < from; k++) show(r, k, true);
  const clips = clipsOf(r); prefetch(r.nextElementSibling);
  if (canSpeak && P.sound && !clips[from]) await sleep(80);   // Chrome drops a speak() issued straight after cancel()
  for (let k = from; k < m.steps.length; k++) {
    if (tok !== P.tok) return;
    P.at = k; show(r, k, false); $('.cap', r).textContent = m.steps[k];
    await say(DATA.segs[+r.dataset.i][k], tok, clips[k]);
  }
  if (tok !== P.tok) return;
  P.at = m.steps.length;
  show(r, m.steps.length, false);
  $$('.seg i', r).forEach(s => s.classList.add('on'));
  $('.hk', r).textContent = t.hook;
  await say(DATA.segs[+r.dataset.i][m.steps.length], tok, clips[m.steps.length]);
  if (tok !== P.tok || !P.auto) return;
  await sleep(700);
  if (tok === P.tok) go(r.nextElementSibling);
}
function pause(r){
  if (P.cur !== r) return;
  if (P.paused) { play(r, Math.min(P.at, lastStep(r))); return; }
  halt(); P.paused = true; $('[data-act="pause"]', r).textContent = 'Play';
}
function go(el){ if (el) el.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block: 'start'}); }

// play whichever reel fills the screen; leaving a reel stops it
const io = new IntersectionObserver((es) => {
  for (const e of es) {
    if (!e.isIntersecting) continue;
    const r = e.target;
    if (r.matches('article.reel')) { if (P.cur !== r) play(r); }
    else { halt(); P.cur = null; }
    history.replaceState(null, '', '#' + r.id);
  }
}, { root: $('#feed'), threshold: 0.6 });
$$('.reel').forEach(r => io.observe(r));

// iOS only lets speech start inside a tap, so a tap that turns sound on also speaks once, silently
function soundOn(on){
  P.sound = on && (canSpeak || !!firstClip); $('#sound').setAttribute('aria-pressed', P.sound);
  if (P.sound && canSpeak) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
  // no reel is playing yet (the intro's Start button): unlock the player now, inside the tap
  if (P.sound && !P.cur && firstClip) {
    const tok = P.tok; player.muted = true; player.src = firstClip;
    player.play().then(() => { if (tok === P.tok) player.pause(); player.muted = false; }).catch(() => { player.muted = false; });
  }
  if (P.cur) play(P.cur, Math.min(P.at, lastStep(P.cur)));
}
$('#sound').addEventListener('click', () => soundOn(!P.sound));
$('#auto').addEventListener('click', e => { P.auto = !P.auto; e.currentTarget.setAttribute('aria-pressed', P.auto); toast(P.auto ? 'Moves to the next reel when one ends.' : 'Stays on each reel until you swipe.'); });
$('#start-sound').addEventListener('click', () => { soundOn(true); go($('article.reel')); });
$('#start-muted').addEventListener('click', () => { soundOn(false); go($('article.reel')); });
$('#feed').addEventListener('click', async e => {
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); go(j.dataset.jump === 'intro' ? $('#intro') : $('#r-' + j.dataset.jump)); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const r = a.closest('article.reel');
  if (a.dataset.act === 'pause') pause(r);
  if (a.dataset.act === 'replay') play(r, 0);
  if (a.dataset.act === 'link') {
    const url = location.origin + location.pathname + '#' + r.id;
    try { await navigator.clipboard.writeText(url); toast('Link copied.'); } catch(_) { toast(url); }
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const here = P.cur || $('#intro');
  if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'PageDown') { e.preventDefault(); go(here.nextElementSibling); }
  if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'PageUp') { e.preventDefault(); go(here.previousElementSibling); }
  if (e.key === ' ' && P.cur && !e.target.closest('button,a')) { e.preventDefault(); pause(P.cur); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.cur && !P.paused) pause(P.cur); });
$('#theme').addEventListener('click', () => {
  let c = document.documentElement.getAttribute('data-theme');
  if (!c) c = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('gradient_path_theme', n); } catch(e) {}
});
// a shared link opens on its reel
const h = location.hash.slice(1); if (h && document.getElementById(h)) document.getElementById(h).scrollIntoView({block: 'start'});
})();
</script>
</body></html>
