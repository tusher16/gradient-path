/* tokens and the diagram styles are copied in from page.html by build.js, never edited here */
:root{
  --ground:#EFF3F2; --surface:#FFFFFF; --sunk:#E6ECEA;

  --ink:#131C1A; --ink-2:#3B4B48; --muted:#687975;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{
  --ground:#0C1211; --surface:#141C1B; --sunk:#101817;
  --line:#283432; --line-soft:#1E2827;
  --ink:#E7EEEC; --ink-2:#B6C4C1; --muted:#84948F; --meta:#84948F;
  --signal:#FF6A9C; --signal-soft:#33141F;
  --memory:#42D3BF; --memory-soft:#0C2B28;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 32px -20px rgba(0,0,0,.8);
  color-scheme:dark;
}
/* motion explainers: one authored diagram per topic. At rest the
   finished diagram shows; .run replays it step by step, each step --step apart */
.mo{margin:0 0 20px; padding:14px 16px 12px; background:var(--sunk); border-radius:14px; --step:1.8s}
.mo svg{display:block; width:100%; height:auto; max-height:320px; overflow:visible}
.mo .bx{fill:var(--surface); stroke:var(--line); stroke-width:1.5}
.mo .bx.m{fill:var(--memory-soft); stroke:var(--memory)}
.mo .bx.s{fill:var(--signal-soft); stroke:var(--signal)}
.mo .bx.off{fill:none; stroke:var(--ink-2); stroke-dasharray:4 4}
.mo .ln{fill:none; stroke:var(--ink-2); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
.mo .ln.m{stroke:var(--memory)} .mo .ln.s{stroke:var(--signal)} .mo .ln.dash{stroke-dasharray:5 5}
.mo .dot{fill:var(--ink-2)} .mo .dot.m{fill:var(--memory)} .mo .dot.s{fill:var(--signal)}
.mo .pl{fill:var(--line)}
.mo text{font-family:var(--body); font-size:15px; fill:var(--ink-2)}
.mo text.lb{font-size:16px; font-weight:600; fill:var(--ink)}
.mo text.lb.m{fill:var(--memory)} .mo text.lb.s{fill:var(--signal)}
.mo text.hd{font-family:var(--display); font-size:19px; font-weight:700; fill:var(--ink)}
.mo .mid{text-anchor:middle} .mo .end{text-anchor:end}
.mo .g{transform-box:fill-box; transform-origin:center}
.mo.run .a{animation:moIn var(--dur,.5s) cubic-bezier(.16,1,.3,1) calc(var(--t,0) * var(--step) + var(--o,0s)) both}
.mo.run .a.g{animation-name:moGrow}
.mo.run .a.d{stroke-dasharray:1; animation-name:moDraw; animation-timing-function:cubic-bezier(.33,0,.2,1)}
@keyframes moIn{from{opacity:0; transform:translate(var(--x,0px),var(--y,8px))}}
@keyframes moGrow{from{opacity:0; transform:scale(.55)}}
@keyframes moDraw{from{stroke-dashoffset:1}}
.mocap{margin:12px 0 0; padding:0; list-style:none; display:grid; gap:6px; font-size:.92rem; color:var(--ink-2); counter-reset:mo}
.mocap li{display:grid; grid-template-columns:22px minmax(0,1fr); gap:0 6px; counter-increment:mo}
.mocap li::before{content:counter(mo); font-family:var(--mono); font-size:.78rem; color:var(--memory); padding-top:2px}
.mo.run .mocap li{animation:moCap .5s ease-out calc(var(--t) * var(--step)) both}
@keyframes moCap{from{opacity:.25}}
.mo .mofoot{display:flex; justify-content:flex-end; margin-top:8px}
.mo .mofoot .btn{font-size:.8rem; padding:6px 12px}
@media (prefers-reduced-motion:reduce){.mo.run .a, .mo.run .mocap li{animation:none} .mo .mofoot{display:none}}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0; background:var(--ground); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased; overflow:hidden}
::selection{background:var(--signal-soft); color:var(--ink)}
a{color:inherit; text-underline-offset:3px; text-decoration-color:var(--line)}
a:hover{text-decoration-color:var(--signal)}
h1,h2{font-family:var(--display); margin:0; letter-spacing:-.015em; text-wrap:balance; font-weight:700}
button{font:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--signal); outline-offset:3px; border-radius:6px}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}

.bar{position:fixed; inset:0 0 auto; z-index:5; height:52px; background:var(--surface); border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px; height:100%; margin:0 auto; padding:0 20px; display:flex; align-items:center; gap:8px}
.home{font-family:var(--display); font-weight:700; text-decoration:none; font-size:1rem; margin-right:auto; white-space:nowrap}
.home b{font-weight:700} .home .short{display:none}
.home span{color:var(--meta); font-weight:500}
.tog{font-family:var(--mono); font-size:.74rem; border:1px solid var(--line); background:transparent; border-radius:999px; padding:6px 11px; white-space:nowrap}
.tog:hover{border-color:var(--ink-2)}
.tog[aria-pressed="true"]{border-color:var(--memory); color:var(--memory)}
.tog:disabled{opacity:.45; cursor:not-allowed}
.btn{font-family:var(--mono); font-size:.8rem; font-weight:600; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); padding:9px 15px; text-decoration:none; display:inline-flex; align-items:center; min-height:40px}
.btn:hover{border-color:var(--ink-2)}
.btn.go{background:var(--memory); border-color:var(--memory); color:var(--surface)}

/* the feed: one reel per screen, snapping */
.feed{position:fixed; inset:52px 0 0; overflow-y:auto; scroll-snap-type:y mandatory; overscroll-behavior:contain; scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.reel{height:calc(100dvh - 52px); scroll-snap-align:start; scroll-snap-stop:always; display:grid; place-items:center; padding:14px 16px}
.card{width:min(100%, 470px, calc((100dvh - 80px) * 9 / 16)); height:min(100%, 840px); background:var(--surface);
  border:1px solid var(--line); border-radius:16px; padding:18px 18px 14px; display:flex; flex-direction:column; gap:10px; overflow:hidden}
.meta{display:flex; justify-content:space-between; gap:12px; font-family:var(--mono); font-size:.72rem; color:var(--meta); white-space:nowrap}
.meta span:first-child{overflow:hidden; text-overflow:ellipsis}
.card h2{font-size:clamp(1.25rem, 4.4vw, 1.5rem); line-height:1.2}
.card .mo{margin:0; padding:12px; flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center}
.card .mo svg{max-height:100%; width:100%}
/* reels drive the steps from script: an element shows when its step is reached */
.card .mo .a{opacity:0}
.card .mo .a.on{opacity:1; animation:moIn var(--dur,.5s) cubic-bezier(.16,1,.3,1) var(--o,0s) both}
.card .mo .a.g.on{animation-name:moGrow}
.card .mo .a.d.on{stroke-dasharray:1; animation-name:moDraw; animation-timing-function:cubic-bezier(.33,0,.2,1)}
.card .mo .a.now{animation:none}
.seg{display:flex; gap:4px}
.seg i{flex:1; height:3px; border-radius:2px; background:var(--line); transition:background .3s ease-out}
.seg i.on{background:var(--memory)}
.cap{margin:0; font-size:1.06rem; line-height:1.5; min-height:4.5em; color:var(--ink)}
.hk{margin:0; font-family:var(--display); font-weight:700; font-size:1.02rem; line-height:1.35; color:var(--memory); min-height:2.7em}
.hk:empty{visibility:hidden}
.acts{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.acts .btn{padding:7px 13px; min-height:36px; font-size:.76rem}

/* intro and end cards */
.card.plain{justify-content:center; gap:16px}
.card.plain h1{font-size:clamp(1.9rem, 7vw, 2.4rem); line-height:1.08}
.card.plain p{margin:0; color:var(--ink-2)}
.card.plain .row{display:flex; flex-wrap:wrap; gap:10px}
.doms{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.doms li{border-bottom:1px solid var(--line)}
.doms a{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; padding:9px 2px; text-decoration:none; font-size:.92rem}
.doms .n{font-family:var(--mono); color:var(--memory); font-size:.8rem; padding-top:2px}
.doms .c{font-family:var(--mono); color:var(--meta); font-size:.74rem; padding-top:3px}
.note{font-size:.82rem; color:var(--meta) !important}
.toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(14px); background:var(--ink); color:var(--ground);
  padding:9px 15px; border-radius:999px; font-size:.86rem; opacity:0; transition:opacity .2s ease-out, transform .2s ease-out; pointer-events:none; z-index:9}
.toast.on{opacity:1; transform:translateX(-50%)}
@media (max-width:640px){
  .bar-in{padding:0 12px; gap:6px}
  .home .long{display:none} .home .short{display:inline}
  .tog{padding:6px 9px; font-size:.7rem}
  .reel{padding:0}
  .card{width:100%; height:100%; border-radius:0; border:0; padding:16px 16px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important} .card .mo .a.on{animation:none}}

<script>
const DATA = {"topics":[{"id":"ai-nesting","d":1,"title":"AI, ML, deep learning, GenAI and agentic AI","hook":"Boxes inside boxes: AI ⊃ ML ⊃ deep learning ⊃ GenAI. Agentic = GenAI that takes actions."},{"id":"learning-types","d":1,"title":"Supervised, unsupervised and reinforcement learning","hook":"Answer key = supervised. No key, find groups = unsupervised. Points for good moves = reinforcement."},{"id":"data-types","d":1,"title":"Types of data: labelled, structured, time-series and more","hook":"Table = structured. Everything else (text, image, audio) = unstructured. Clock in the data = time-series."},{"id":"inference-types","d":1,"title":"Inference types: real-time, batch, asynchronous, serverless","hook":"Waiting customer = real-time. Overnight pile = batch. Big job, call me later = async. Rare traffic, pay per use = serverless."},{"id":"use-cases","d":1,"title":"When AI fits, when it does not, and which technique","hook":"Number → regression. Category → classification. Hidden groups → clustering. Must be exact → no ML."},{"id":"aws-ai-services","d":1,"title":"AWS managed AI services (no ML expertise needed)","hook":"TranSCRIBE writes down what you say; POLLY the parrot speaks. Textract reads paper; Rekognition looks at pictures; Comprehend understands text."},{"id":"trad-ml-vs-fm","d":1,"title":"Traditional ML or a foundation model?","hook":"Neat table + must explain + millions per second → traditional ML. Messy language + many tasks → foundation model."},{"id":"ml-lifecycle","d":1,"title":"The ML pipeline, stage by stage, with the AWS service for each","hook":"Goal → data → clean → features → train → evaluate → deploy → monitor → retrain. A loop, not a line."},{"id":"mlops","d":1,"title":"MLOps: making ML repeatable","hook":"MLOps = the model ships the same way every time, and someone notices when it goes stale."},{"id":"metrics","d":1,"title":"Model metrics and business metrics","hook":"Precision = “when I shout fire, is there fire?” Recall = “did I catch every fire?”"},{"id":"tokens-embeddings","d":2,"title":"Tokens, chunking, embeddings and vectors","hook":"Tokens are what you pay for. Embeddings are meaning as coordinates. Chunks are bite-size pieces you can find."},{"id":"model-types","d":2,"title":"Transformers, foundation models, multimodal and diffusion models","hook":"Transformer = attention to every word at once. Diffusion = sculpt a picture out of static."},{"id":"fm-lifecycle","d":2,"title":"The foundation model lifecycle","hook":"Data → model → pre-train → fine-tune → evaluate → deploy → feedback. You usually join at step 4 or later."},{"id":"genai-tradeoffs","d":2,"title":"What GenAI is good and bad at, and how to choose a model","hook":"Pros: adaptable, conversational, creative. Cons: hallucinates, changes its answer, cannot explain itself."},{"id":"token-pricing","d":2,"title":"Token pricing and the cost trade-offs of AWS GenAI","hook":"On-demand = taxi meter. Provisioned throughput = leased car. Batch = freight train, cheap but slow."},{"id":"aws-genai-stack","d":2,"title":"The AWS GenAI stack: Bedrock, SageMaker, JumpStart, Nova, Quick, Kiro, Strands, AgentCore","hook":"Bedrock = rent a model by the token. SageMaker = run your own. JumpStart = SageMaker’s model shelf. AgentCore = where agents live in production."},{"id":"agentic-ai","d":2,"title":"Agents, tools, memory, MCP and context engineering","hook":"Agent = model + tools + loop + memory. MCP = USB for tools. Context engineering = packing the model’s suitcase well."},{"id":"fm-selection-params","d":3,"title":"Choosing an FM and setting temperature, top-p and length","hook":"Temperature low = librarian. Temperature high = poet."},{"id":"rag","d":3,"title":"RAG, Bedrock Knowledge Bases and vector databases","hook":"RAG = open-book exam. Fresh documents, no retraining, answers with citations."},{"id":"customization-ladder","d":3,"title":"The customisation cost ladder: prompt, RAG, fine-tune, continued pre-train, pre-train, distil","hook":"Climb the ladder only as far as you must: prompt → RAG → fine-tune → continued pre-train → pre-train. The ladder ranks up-front effort, not every monthly bill."},{"id":"fine-tuning-data","d":3,"title":"Fine-tuning methods and preparing the data","hook":"Good fine-tuning data is CLEAN: Curated, Labelled, Enough, Accurate-to-real-users, Not-secret."},{"id":"prompt-techniques","d":3,"title":"Prompt engineering techniques and Bedrock Prompt Management","hook":"Zero = just ask. One = show one. Few = show several. Chain-of-thought = “think step by step”."},{"id":"prompt-risks","d":3,"title":"Prompt risks: injection, hijacking, jailbreaking, poisoning, exposure","hook":"Injection sneaks in orders. Jailbreak talks past the rules. Poisoning taints the food. Exposure spills the secrets."},{"id":"fm-evaluation","d":3,"title":"Evaluating FMs: humans, benchmarks, ROUGE, BLEU, BERTScore, LLM-as-a-judge","hook":"ROUGE for Resumés (summaries), BLEU for Bilingual (translation), BERTScore for meaning."},{"id":"responsible-ai","d":4,"title":"Responsible AI, Bedrock Guardrails and the legal risks","hook":"Guardrails = topic bouncer + profanity filter + PII blur + source-support check, around any model."},{"id":"bias-variance","d":4,"title":"Bias, variance, datasets and detecting bias","hook":"High bias = underfit (too simple). High variance = overfit (memorised). Unfair bias = bad data in, unfair answers out."},{"id":"transparency","d":4,"title":"Transparent and explainable models","hook":"Transparent = glass box. Explainable = black box with a good witness."},{"id":"securing-ai","d":5,"title":"Securing AI systems on AWS","hook":"IAM = who. KMS = locked. Macie = find the secrets in S3. PrivateLink = private road. Guardrails = what is said."},{"id":"data-lineage","d":5,"title":"Data lineage, cataloguing and secure data engineering","hook":"Lineage = the family tree. Catalogue = the library index. Cite your sources like a good essay."},{"id":"governance","d":5,"title":"Governance and compliance: Config, Inspector, Artifact, CloudTrail, Trusted Advisor","hook":"CloudTrail = who did it. Config = is it still set right. Inspector = is it vulnerable. Artifact = AWS’s paperwork. Trusted Advisor = best-practice checklist."}],"motion":{"ai-nesting":{"h":262,"steps":["AI: any machine doing something we would call smart, even rules a person wrote by hand.","Machine learning sits inside: it learns the rules from examples instead.","Deep learning sits inside that: neural networks with many layers, good at images, speech and language.","Generative AI sits inside deep learning: models that make new text, images or code.","Agentic AI is generative AI put in a loop: it plans, calls tools, checks the result and repeats."],"svg":"\u003crect class=\"a bx\" x=\"8\" y=\"8\" width=\"424\" height=\"246\" rx=\"16\" style=\"--t:0\"/>\u003ctext class=\"a lb\" x=\"24\" y=\"34\" style=\"--t:0\">AI\u003c/text>\u003crect class=\"a bx\" x=\"28\" y=\"46\" width=\"386\" height=\"198\" rx=\"14\" style=\"--t:1\"/>\u003ctext class=\"a lb\" x=\"44\" y=\"72\" style=\"--t:1\">Machine learning\u003c/text>\u003crect class=\"a bx\" x=\"48\" y=\"86\" width=\"348\" height=\"148\" rx=\"12\" style=\"--t:2\"/>\u003ctext class=\"a lb\" x=\"64\" y=\"112\" style=\"--t:2\">Deep learning\u003c/text>\u003crect class=\"a bx m\" x=\"68\" y=\"126\" width=\"168\" height=\"92\" rx=\"10\" style=\"--t:3\"/>\u003ctext class=\"a lb m\" x=\"84\" y=\"154\" style=\"--t:3\">Generative AI\u003c/text>\u003ctext class=\"a \" x=\"84\" y=\"178\" style=\"--t:3;--o:0.3s\">makes new things\u003c/text>\u003cg class=\"a\" style=\"--t:4;--x:-10px;--y:0px\">\u003cpath class=\"ln s\" d=\"M240 170 L284 170 M277.0 166.2 L284 170 L277.0 173.8\"/>\u003c/g>\u003cpath class=\"a ln s d\" d=\"M318 140 A30 30 0 1 1 288 170\" pathLength=\"1\" style=\"--t:4;--o:0.2s\"/>\u003ccircle class=\"a dot s g\" cx=\"318\" cy=\"140\" r=\"5\" style=\"--t:4;--o:0.5s\"/>\u003ccircle class=\"a dot s g\" cx=\"348\" cy=\"170\" r=\"5\" style=\"--t:4;--o:0.7s\"/>\u l model scores them."],"svg":"\u003crect class=\"a bx\" x=\"14\" y=\"150\" width=\"200\" height=\"70\" rx=\"12\" style=\"--t:0\"/>\u003ctext class=\"a mid lb\" x=\"114\" y=\"180\" style=\"--t:0\">Traditional ML\u003c/text>\u003ctext class=\"a mid\" x=\"114\" y=\"204\" style=\"--t:0;--o:0.2s\">small, cheap, explainable\u003c/text>\u003crect class=\"a bx m\" x=\"226\" y=\"150\" width=\"200\" height=\"70\" rx=\"12\" style=\"--t:0;--o:0.3s\"/>\u003ctext class=\"a mid lb m\" x=\"326\" y=\"180\" style=\"--t:0;--o:0.3s\">Foundation model\u003c/text>\u003ctext class=\"a mid\" x=\"326\" y=\"204\" style=\"--t:0;--o:0.5s\">messy input, many tasks\u003c/text>\u003cg class=\"a\" style=\"--t:1;--x:0px;--y:-40px\">\u003crect class=\"bx\" x=\"24\" y=\"60\" width=\"104\" height=\"30\" rx=\"15\"/>\u003ctext class=\"mid\" x=\"76\" y=\"80\">huge volume\u003c/text>\u003c/g>\u003cg class=\"a\" style=\"--t:1;--o:0.2s;--x:0px;--y:-40px\">\u003crect class=\"bx\" x=\"24\" y=\"102\" width=\"92\" height=\"30\" rx=\"15\"/>\u003ctext class=\"mid\" x=\"70\" y=\"122\">tabular data\u003c/text>\u003c/g>\u003cg class=\"a\" style=\"--t:1;--o:0.4s;--x:0px;--y:-40px\">\u003crect class=\"bx\" x=\"122\" y=\"102\" width=\"92\" height=\"30\" rx=\"15\"/>\u003ctext class=\"mid\" x=\"168\" y=\"122\">must explain\u003c/text>\u003c/g>\u003cg class=\"a\" style=\"--t:2;--x:0px;--y:-40px\">\u003crect class=\"bx m\" x=\"236\" y=\"60\" width=\"150\" height=\"30\" rx=\"15\"/>\u003ctext class=\"mid\" x=\"311\" y=\"80\">free text, images\u003c/text>\u003c/g>\u003cg class=\"a\" style=\"--t:2;--o:0.2s;--x:0px;--y:-40px\">\u003crect class=\"bx m\" x=\"236\" y=\"102\" width=\"92\" height=\"30\" rx=\"15\"/>\u003ctext class=\"mid\" x=\"282\" y=\"122\">many tasks\u003c/text>\u003c/g>\u003cg class=\"a\" style=\"--t:2;--o:0.4s;--x:0px;--y:-40px\">\u003crect class=\"bx m\" x=\"334\" y=\"102\" width=\"92\" height=\"30\" rx=\"15\"/>\u003ctext class=\"mid\" x=\"380\" y=\"122\">few labels\u003c/text>\u003c/g>\u003cpath class=\"a ln s d\" d=\"M300 222 Q 220 246 140 222\" pathLength=\"1\" style=\"--t:3\"/>\u003ctext class=\"a mid lb s\" x=\"220\" y=\"250\" style=\"--t:3;--o:0.4s\">or both\u003c/text>"},"ml-lifecycle":{"h":250,"steps":["Start with the business goal, then collect the data (Amazon S3, AWS Glue).","Clean it (Glue DataBrew, Data Wrangler) and shape it into features (Feature Store).","Train and tune it (SageMaker AI), then evaluate it on data it never saw.","Deploy it behind an endpoint or a managed API, and monitor it (Model Monitor).","When the world changes, monitoring triggers retraining. It is a loop, not a line."],"svg":"\u003cellipse class=\"a ln d\" cx=\"220\" cy=\"125\" rx=\"170\" ry=\"85\" pathLength=\"1\" style=\"--t:0;--dur:7s\"/>\u003crect class=\"a bx\" x=\"177\" y=\"25\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:0\"/>\u003ctext class=\"a mid lb\" x=\"220\" y=\"45\" style=\"--t:0\">Goal\u003c/text>\u003crect class=\"a bx\" x=\"297\" y=\"50\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.6s\"/>\u003ctext class=\"a mid lb\" x=\"340\" y=\"70\" style=\"--t:0;--o:0.6s\">Data\u003c/text>\u003crect class=\"a bx\" x=\"347\" y=\"110\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:1\"/>\u003ctext class=\"a mid lb\" x=\"390\" y=\"130\" style=\"--t:1\">Clean\u003c/text>\u003crect class=\"a bx\" x=\"297\" y=\"170\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:1;--o:0.6s\"/>\u003ctext class=\"a mid lb\" x=\"340\" y=\"190\" style=\"--t:1;--o:0.6s\">Features\u003c/text>\u003crect class=\"a bx\" x=\"177\" y=\"195\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:2\"/>\u003ctext class=\"a mid lb\" x=\"220\" y=\"215\" style=\"--t:2\">Train\u003c/text>\u003crect class=\"a bx\" x=\"57\" y=\"170\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:2;--o:0.6s\"/>\u003ctext class=\"a mid lb\" x=\"100\" y=\"190\" style=\"--t:2;--o:0.6s\">Evaluate\u003c/text>\u003crect class=\"a bx\" x=\"7\" y=\"110\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:3\"/>\u003ctext class=\"a mid lb\" x=\"50\" y=\"130\" style=\"--t:3\">Deploy\u003c/text>\u003crect class=\"a bx\" x=\"57\" y=\"50\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.6s\"/>\u003ctext class=\"a mid lb\" x=\"100\" y=\"70\" style=\"--t:3;--o:0.6s\">Monitor\u003c/text>\u003crect class=\"a bx s\" x=\"57\" y=\"50\" width=\"86\" height=\"30\" rx=\"15\" style=\"--t:4\"/>\u003ctext class=\"a mid lb s\" x=\"100\" y=\"70\" style=\"--t:4\">Monitor\u003c/text>\u003ctext class=\"a mid hd\" x=\"220\" y=\"120\" style=\"--t:4;--o:0.3s\">a loop, not a line\u003c/text>\u003ctext class=\"a mid lb s\" x=\"220\" y=\"146\" style=\"--t:4;--o:0.6s\">drift → retrain\u003c/text>"},"mlops":{"h":236,"steps":["MLOps puts training and deployment in one automated pipeline (SageMaker Pipelines).","Every run repeats the same steps, so any model version can be rebuilt.","In production, Model Monitor watches quality against a threshold.","Customer behaviour shifts and accuracy slides below the line: that is drift.","The drop triggers retraining, and the new model goes back through the same pipeline."],"svg":"\u003crect class=\"a bx m\" x=\"6\" y=\"20\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:0\"/>\u003ctext class=\"a mid lb m\" x=\"45\" y=\"40\" style=\"--t:0\">Code\u003c/text>\u003crect class=\"a bx m\" x=\"92\" y=\"20\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"131\" y=\"40\" style=\"--t:0;--o:0.2s\">Train\u003c/text>\u003crect class=\"a bx m\" x=\"178\" y=\"20\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.4s\"/>\u003ctext class=\"a mid lb m\" x=\"217\" y=\"40\" style=\"--t:0;--o:0.4s\">Evaluate\u003c/text>\u003crect class=\"a bx m\" x=\"264\" y=\"20\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.6000000000000001s\"/>\u003ctext class=\"a mid lb m\" x=\"303\" y=\"40\" style=\"--t:0;--o:0.6000000000000001s\">Register\u003c/text>\u003crect class=\"a bx m\" x=\"350\" y=\"20\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.8s\"/>\u003ctext class=\"a mid lb m\" x=\"389\" y=\"40\" style=\"--t:0;--o:0.8s\">Deploy\u003c/text>\u003ctext class=\"a end\" x=\"424\" y=\"78\" style=\"--t:1\">same steps, every run\u003c/text>\u003cpath class=\"a ln m\" d=\"M84 35 H92 M170 35 H178 M256 35 H264 M342 35 H350\" pathLength=\"1\" style=\"--t:1\"/>\u003cpath class=\"a ln\" d=\"M40 104 V214 H424\" pathLength=\"1\" style=\"--t:2\"/>\u003cpath class=\"a ln dash\" d=\"M40 150 H424\" pathLength=\"1\" style=\"--t:2;--o:0.2s\"/>\u003ctext class=\"a end\" x=\"424\" y=\"144\" style=\"--t:2;--o:0.3s\">threshold\u003c/text>\u003ctext class=\"a \" x=\"48\" y=\"118\" style=\"--t:2;--o:0.3s\">accuracy\u003c/text>\u003cpath class=\"a ln d\" d=\"M44 126 L110 124 L170 128 L220 134\" pathLength=\"1\" style=\"--t:2;--o:0.6s\"/>\u003cpath class=\"a ln s d\" d=\"M220 134 L250 150 L290 176\" pathLength=\"1\" style=\"--t:3\"/>\u003ccircle class=\"a dot s g\" cx=\"290\" cy=\"176\" r=\"7\" style=\"--t:3;--o:0.5s\"/>\u003ctext class=\"a mid lb s\" x=\"290\" y=\"204\" style=\"--t:3;--o:0.6s\">drift detected\u003c/text>\u003cpath class=\"a ln m d\" d=\"M296 168 C 250 120 140 110 131 54\" pathLength=\"1\" style=\"--t:4\"/>\u003cpath class=\"a ln m d\" d=\"M290 176 L330 136 L420 128\" pathLength=\"1\" style=\"--t:4;--o:0.8s\"/>"},"metrics":{"h":224,"steps":["Twenty payments, four of them fraud. When one outcome is rare, accuracy misleads.","A model that always says “not fraud” is 80% accurate and catches nothing.","A better model flags five. Precision: 3 of its 5 flags were fraud. Recall: it caught 3 of the 4 frauds.","One fraud slipped through. When a miss is costly, push recall up and accept more false alarms."],"svg":"\u003ccircle class=\"a dot  g\" cx=\"36\" cy=\"44\" r=\"9\" style=\"--t:0;--o:0.18s\"/>\u003ccircle class=\"a dot  g\" cx=\"36\" cy=\"84\" r=\"9\" style=\"--t:0;--o:0.06s\"/>\u003ccircle class=\"a dot s g\" cx=\"36\" cy=\"124\" r=\"9\" style=\"--t:0;--o:0.36s\"/>\u003ccircle class=\"a dot  g\" cx= cle class=\"a ln m g\" cx=\"116\" cy=\"44\" r=\"16\" style=\"--t:2;--o:0.36s\"/>\u003ccircle class=\"a ln m g\" cx=\"116\" cy=\"124\" r=\"16\" style=\"--t:2;--o:0.48s\"/>\u003ctext class=\"a \" x=\"232\" y=\"138\" style=\"--t:2;--o:0.4s\">Model B flags 5:\u003c/text>\u003ctext class=\"a lb m\" x=\"232\" y=\"160\" style=\"--t:2;--o:0.6s\">precision 3/5 = 60%\u003c/text>\u003ctext class=\"a lb m\" x=\"232\" y=\"182\" style=\"--t:2;--o:0.8s\">recall 3/4 = 75%\u003c/text>\u003ccircle class=\"a ln s g\" cx=\"196\" cy=\"164\" r=\"16\" style=\"--t:3\"/>\u003ctext class=\"a mid lb s\" x=\"196\" y=\"206\" style=\"--t:3;--o:0.3s\">missed\u003c/text>"},"tokens-embeddings":{"h":250,"steps":["A model reads tokens, sub-word pieces, not words. Prices and limits are counted in tokens.","An embedding turns a piece of text into a vector: a point whose position captures its meaning.","Similar meanings land close together, so a search for “money back” finds the refund policy.","Chunking cuts a long document into pieces before embedding, so search returns one paragraph, not a whole manual."],"svg":"\u003ctext class=\"a mid hd\" x=\"220\" y=\"26\" style=\"--t:0\">Unbelievable\u003c/text>\u003crect class=\"a bx m\" x=\"116\" y=\"40\" width=\"56\" height=\"28\" rx=\"14\" style=\"--t:0;--o:0.4s\"/>\u003ctext class=\"a mid lb m\" x=\"144\" y=\"59\" style=\"--t:0;--o:0.4s\">Un\u003c/text>\u003crect class=\"a bx m\" x=\"180\" y=\"40\" width=\"80\" height=\"28\" rx=\"14\" style=\"--t:0;--o:0.55s\"/>\u003ctext class=\"a mid lb m\" x=\"220\" y=\"59\" style=\"--t:0;--o:0.55s\">believ\u003c/text>\u003crect class=\"a bx m\" x=\"268\" y=\"40\" width=\"60\" height=\"28\" rx=\"14\" style=\"--t:0;--o:0.7s\"/>\u003ctext class=\"a mid lb m\" x=\"298\" y=\"59\" style=\"--t:0;--o:0.7s\">able\u003c/text>\u003cpath class=\"a ln\" d=\"M40 100 V232 H246\" pathLength=\"1\" style=\"--t:1\"/>\u003ccircle class=\"a dot g\" cx=\"96\" cy=\"146\" r=\"7\" style=\"--t:1;--o:0.3s\"/>\u003ctext class=\"a \" x=\"50\" y=\"114\" style=\"--t:1;--o:0.3s\">refund policy\u003c/text>\u003ccircle class=\"a dot g\" cx=\"124\" cy=\"160\" r=\"7\" style=\"--t:1;--o:0.5s\"/>\u003ctext class=\"a \" x=\"140\" y=\"166\" style=\"--t:1;--o:0.5s\">money back\u003c/text>\u003ccircle class=\"a dot g\" cx=\"226\" cy=\"212\" r=\"7\" style=\"--t:1;--o:0.7s\"/>\u003ctext class=\"a end\" x=\"216\" y=\"200\" style=\"--t:1;--o:0.7s\">holiday rota\u003c/text>\u003ccircle class=\"a ln m g\" cx=\"110\" cy=\"153\" r=\"30\" style=\"--t:2\"/>\u003ctext class=\"a lb m\" x=\"48\" y=\"226\" style=\"--t:2;--o:0.3s\">close = similar\u003c/text>\u003crect class=\"a bx\" x=\"278\" y=\"100\" width=\"54\" height=\"132\" rx=\"4\" style=\"--t:3\"/>\u003cpath class=\"a ln\" d=\"M286 116 H324 M286 128 H318 M286 140 H324 M286 152 H312 M286 164 H324 M286 176 H320 M286 188 H324 M286 200 H316 M286 212 H322\" pathLength=\"1\" style=\"--t:3\"/>\u003crect class=\"a bx m\" x=\"368\" y=\"100\" width=\"60\" height=\"36\" rx=\"4\" style=\"--t:3;--o:0.4s\"/>\u003crect class=\"a bx m\" x=\"368\" y=\"148\" width=\"60\" height=\"36\" rx=\"4\" style=\"--t:3;--o:0.6000000000000001s\"/>\u003crect class=\"a bx m\" x=\"368\" y=\"196\" width=\"60\" height=\"36\" rx=\"4\" style=\"--t:3;--o:0.8s\"/>\u003cg class=\"a\" style=\"--t:3;--o:0.3s;--x:-10px;--y:0px\">\u003cpath class=\"ln m\" d=\"M336 166 L362 166 M355.0 162.2 L362 166 L355.0 169.8\"/>\u003c/g>"},"model-types":{"h":300,"steps":["A transformer reads the whole passage at once and works out which words matter to which. That is attention.","A foundation model is pre-trained once on huge general data, then adapted to many tasks.","A multimodal model takes more than one kind of input or output, like a photo plus a question.","A diffusion model starts from random noise and removes it step by step until a picture appears."],"svg":"\u003ctext class=\"a lb\" x=\"12\" y=\"22\" style=\"--t:0\">Transformer\u003c/text>\u003crect class=\"a bx\" x=\"40\" y=\"62\" width=\"52\" height=\"28\" rx=\"14\" style=\" ions\u003c/text>\u003cg class=\"a\" style=\"--t:2;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M326 72 L342 72 M335.0 68.2 L342 72 L335.0 75.8\"/>\u003c/g>\u003crect class=\"a bx m\" x=\"344\" y=\"56\" width=\"92\" height=\"32\" rx=\"16\" style=\"--t:2;--o:0.1s\"/>\u003ctext class=\"a mid lb m\" x=\"390\" y=\"77\" style=\"--t:2;--o:0.1s\">Fine-tune\u003c/text>\u003cg class=\"a\" style=\"--t:2;--o:0.4s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M390 90 L390 136 M393.8 129.0 L390 136 L386.2 129.0\"/>\u003c/g>\u003crect class=\"a bx\" x=\"344\" y=\"140\" width=\"92\" height=\"32\" rx=\"16\" style=\"--t:2;--o:0.5s\"/>\u003ctext class=\"a mid lb\" x=\"390\" y=\"161\" style=\"--t:2;--o:0.5s\">Evaluate\u003c/text>\u003cg class=\"a\" style=\"--t:2;--o:0.7s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M342 156 L326 156 M333.0 159.8 L326 156 L333.0 152.2\"/>\u003c/g>\u003crect class=\"a bx\" x=\"232\" y=\"140\" width=\"92\" height=\"32\" rx=\"16\" style=\"--t:2;--o:0.8s\"/>\u003ctext class=\"a mid lb\" x=\"278\" y=\"161\" style=\"--t:2;--o:0.8s\">Deploy\u003c/text>\u003cg class=\"a\" style=\"--t:3;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M230 156 L214 156 M221.0 159.8 L214 156 L221.0 152.2\"/>\u003c/g>\u003crect class=\"a bx m\" x=\"120\" y=\"140\" width=\"92\" height=\"32\" rx=\"16\" style=\"--t:3;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"166\" y=\"161\" style=\"--t:3;--o:0.2s\">Feedback\u003c/text>\u003cpath class=\"a ln m d\" d=\"M166 138 Q 250 104 340 84\" pathLength=\"1\" style=\"--t:3;--o:0.6s\"/>\u003ctext class=\"a mid lb m\" x=\"390\" y=\"24\" style=\"--t:4\">you start here\u003c/text>\u003cpath class=\"a ln m\" d=\"M390 30 V52\" pathLength=\"1\" style=\"--t:4;--o:0.2s\"/>"},"genai-tradeoffs":{"h":246,"steps":["Strengths: one model adapts to many jobs, talks naturally and creates new content.","Weakness: it can hallucinate, stating false things confidently.","It is also nondeterministic (the same question can get a different answer), and it cannot explain why it answered as it did.","Choosing a model is a trade-off: modality, latency, cost, context length, compliance and language."],"svg":"\u003ctext class=\"a lb m\" x=\"14\" y=\"24\" style=\"--t:0\">Good at\u003c/text>\u003crect class=\"a bx m\" x=\"14\" y=\"40\" width=\"150\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"89\" y=\"60\" style=\"--t:0;--o:0.2s\">adaptable\u003c/text>\u003crect class=\"a bx m\" x=\"14\" y=\"80\" width=\"150\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.4s\"/>\u003ctext class=\"a mid lb m\" x=\"89\" y=\"100\" style=\"--t:0;--o:0.4s\">conversational\u003c/text>\u003crect class=\"a bx m\" x=\"14\" y=\"120\" width=\"150\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.6000000000000001s\"/>\u003ctext class=\"a mid lb m\" x=\"89\" y=\"140\" style=\"--t:0;--o:0.6000000000000001s\">creates content\u003c/text>\u003ctext class=\"a lb s\" x=\"234\" y=\"24\" style=\"--t:1\">Watch out for\u003c/text>\u003crect class=\"a bx s\" x=\"234\" y=\"40\" width=\"190\" height=\"30\" rx=\"15\" style=\"--t:1;--o:0.2s\"/>\u003ctext class=\"a mid lb s\" x=\"329\" y=\"60\" style=\"--t:1;--o:0.2s\">hallucinates\u003c/text>\u003crect class=\"a bx s\" x=\"234\" y=\"80\" width=\"190\" height=\"30\" rx=\"15\" style=\"--t:2\"/>\u003ctext class=\"a mid lb s\" x=\"329\" y=\"100\" style=\"--t:2\">changes its answer\u003c/text>\u003crect class=\"a bx s\" x=\"234\" y=\"120\" width=\"190\" height=\"30\" rx=\"15\" style=\"--t:2;--o:0.3s\"/>\u003ctext class=\"a mid lb s\" x=\"329\" y=\"140\" style=\"--t:2;--o:0.3s\">hard to explain\u003c/text>\u003ctext class=\"a lb\" x=\"14\" y=\"186\" style=\"--t:3\">Choose by\u003c/text>\u003crect class=\"a bx\" x=\"100\" y=\"166\" width=\"84\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.2s\"/>\u003ctext class=\"a mid \" x=\"142\" y=\"186\" style=\"--t:3;--o:0.2s\">modality\u003c/text>\u003crect class=\"a bx\" x=\"192\" y=\"166\" width=\"76\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.3 />"},"fm-selection-params":{"h":252,"steps":["Pick a model like a vehicle: what it costs, what it can take in, how fast it is, its languages and how much text it holds.","Temperature is a creativity dial. Low gives consistent, predictable wording, good for facts and support.","High gives varied, surprising answers, good for brainstorming slogans.","Neither setting makes an answer true. Accuracy comes from better context, not the dial.","Max tokens caps how long the answer can be, which also caps its cost; a stop sequence says where to stop."],"svg":"\u003crect class=\"a bx\" x=\"14\" y=\"14\" width=\"52\" height=\"30\" rx=\"15\" style=\"--t:0\"/>\u003ctext class=\"a mid \" x=\"40\" y=\"34\" style=\"--t:0\">cost\u003c/text>\u003crect class=\"a bx\" x=\"72\" y=\"14\" width=\"84\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.12s\"/>\u003ctext class=\"a mid \" x=\"114\" y=\"34\" style=\"--t:0;--o:0.12s\">modality\u003c/text>\u003crect class=\"a bx\" x=\"162\" y=\"14\" width=\"76\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.24s\"/>\u003ctext class=\"a mid \" x=\"200\" y=\"34\" style=\"--t:0;--o:0.24s\">latency\u003c/text>\u003crect class=\"a bx\" x=\"244\" y=\"14\" width=\"94\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.36s\"/>\u003ctext class=\"a mid \" x=\"291\" y=\"34\" style=\"--t:0;--o:0.36s\">languages\u003c/text>\u003crect class=\"a bx\" x=\"344\" y=\"14\" width=\"84\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.48s\"/>\u003ctext class=\"a mid \" x=\"386\" y=\"34\" style=\"--t:0;--o:0.48s\">context\u003c/text>\u003ctext class=\"a lb\" x=\"40\" y=\"88\" style=\"--t:1\">temperature\u003c/text>\u003cpath class=\"a ln\" d=\"M40 104 H400\" pathLength=\"1\" style=\"--t:1\"/>\u003ccircle class=\"a dot m g\" cx=\"70\" cy=\"104\" r=\"10\" style=\"--t:1;--o:0.3s\"/>\u003ctext class=\"a mid lb m\" x=\"70\" y=\"132\" style=\"--t:1;--o:0.4s\">low\u003c/text>\u003cpath class=\"a ln m\" d=\"M40 148 H150 M40 160 H150 M40 172 H150\" pathLength=\"1\" style=\"--t:1;--o:0.6s\"/>\u00 8,"steps":["Before any question: documents are cut into chunks, embedded, and stored in a vector database.","A question arrives and is embedded the same way.","The nearest chunks are retrieved and added to the prompt.","The model answers from your documents and cites them.","When documents change, sync the knowledge base so the index updates. No retraining."],"svg":"\u003crect class=\"a bx\" x=\"14\" y=\"38\" width=\"40\" height=\"30\" rx=\"3\" style=\"--t:0\"/>\u003crect class=\"a bx\" x=\"20\" y=\"33\" width=\"40\" height=\"30\" rx=\"3\" style=\"--t:0;--o:0.1s\"/>\u003crect class=\"a bx\" x=\"26\" y=\"28\" width=\"40\" height=\"30\" rx=\"3\" style=\"--t:0;--o:0.2s\"/>\u003cg class=\"a\" style=\"--t:0;--o:0.3s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M70 46 L92 46 M85.0 42.2 L92 46 L85.0 49.8\"/>\u003c/g>\u003crect class=\"a bx\" x=\"96\" y=\"30\" width=\"74\" height=\"32\" rx=\"16\" style=\"--t:0;--o:0.4s\"/>\u003ctext class=\"a mid \" x=\"133\" y=\"51\" style=\"--t:0;--o:0.4s\">chunks\u003c/text>\u003cg class=\"a\" style=\"--t:0;--o:0.6s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M174 46 L196 46 M189.0 42.2 L196 46 L189.0 49.8\"/>\u003c/g>\u003crect class=\"a bx\" x=\"200\" y=\"30\" width=\"70\" height=\"32\" rx=\"16\" style=\"--t:0;--o:0.7s\"/>\u003ctext class=\"a mid \" x=\"235\" y=\"51\" style=\"--t:0;--o:0.7s\">embed\u003c/text>\u003cg class=\"a\" style=\"--t:0;--o:0.9s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M274 46 L296 46 M289.0 42.2 L296 46 L289.0 49.8\"/>\u003c/g>\u003crect class=\"a bx m\" x=\"300\" y=\"30\" width=\"128\" height=\"32\" rx=\"16\" style=\"--t:0;--o:1s\"/>\u003ctext class=\"a mid lb m\" x=\"364\" y=\"51\" style=\"--t:0;--o:1s\">vector store\u003c/text>\u003crect class=\"a bx\" x=\"14\" y=\"120\" width=\"92\" height=\"32\" rx=\"16\" style=\"--t:1\"/>\u003ctext class=\"a mid lb\" x=\"60\" y=\"141\" style=\"--t:1\">question\u003c/text>\u003cg class=\"a\" style=\"--t:1;--o:0.3s;--x:-10px;--y:0px\">\u003cpath class=\"ln \ u003c/text>\u003ctext class=\"a \" x=\"176\" y=\"67\" style=\"--t:3;--o:0.2s\">from scratch\u003c/text>\u003cg class=\"a\" style=\"--t:3;--o:0.4s;--x:-10px;--y:0px\">\u003cpath class=\"ln s\" d=\"M426 252 L426 48 M422.2 55.0 L426 48 L429.8 55.0\"/>\u003c/g>\u003ctext class=\"a end lb s\" x=\"416\" y=\"30\" style=\"--t:3;--o:0.6s\">more cost, data, time\u003c/text>\u003ctext class=\"a mid lb m\" x=\"356\" y=\"128\" style=\"--t:4\">Distillation\u003c/text>\u003ccircle class=\"a bx m g\" cx=\"326\" cy=\"170\" r=\"22\" style=\"--t:4;--o:0.2s\"/>\u003cg class=\"a\" style=\"--t:4;--o:0.5s;--x:-10px;--y:0px\">\u003cpath class=\"ln m\" d=\"M352 170 L370 170 M363.0 166.2 L370 170 L363.0 173.8\"/>\u003c/g>\u003ccircle class=\"a bx m g\" cx=\"386\" cy=\"170\" r=\"12\" style=\"--t:4;--o:0.6s\"/>\u003ctext class=\"a mid\" x=\"326\" y=\"212\" style=\"--t:4;--o:0.3s\">teacher\u003c/text>\u003ctext class=\"a mid\" x=\"392\" y=\"212\" style=\"--t:4;--o:0.7s\">student\u003c/text>"},"fine-tuning-data":{"h":236,"steps":["Instruction tuning: many “request, then a great answer” pairs teach the model to follow instructions.","Domain adaptation and transfer learning reuse what a model already knows and adjust it for a new field.","Good training data is curated, labelled, big enough, representative of real users, and allowed to be used.","A small, clean, representative set beats a big noisy one."],"svg":"\u003crect class=\"a bx\" x=\"14\" y=\"30\" width=\"84\" height=\"28\" rx=\"14\" style=\"--t:0\"/>\u003ctext class=\"a mid \" x=\"56\" y=\"49\" style=\"--t:0\">request\u003c/text>\u003cg class=\"a\" style=\"--t:0;--o:0.1s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M102 44 L120 44 M113.0 40.2 L120 44 L113.0 47.8\"/>\u003c/g>\u003crect class=\"a bx m\" x=\"124\" y=\"30\" width=\"76\" height=\"28\" rx=\"14\" style=\"--t:0;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"162\" y=\"49\" style=\"--t:0;--o:0.2s\">answer\u003c/text>\u003crect class=\"a bx\" x=\"14\" y=\"70\" width=\"84\" heigh ":252,"steps":["High bias is underfitting: the model is too simple and misses the pattern.","High variance is overfitting: it memorises the noise, perfect on training data and poor on new data.","A good fit follows the pattern and ignores the noise.","Bias in the fairness sense starts with the data: a dataset that is mostly one group teaches the model to favour that group.","Catch it by testing each group separately, checking label quality and auditing outputs. SageMaker Clarify measures bias."],"svg":"\u003cpath class=\"a ln\" d=\"M14 16 V112 H144\" pathLength=\"1\" style=\"--t:0\"/>\u003ccircle class=\"a dot\" cx=\"26\" cy=\"98\" r=\"4\" style=\"--t:0;--o:0.1s\"/>\u003ccircle class=\"a dot\" cx=\"40\" cy=\"84\" r=\"4\" style=\"--t:0;--o:0.14s\"/>\u003ccircle class=\"a dot\" cx=\"54\" cy=\"74\" r=\"4\" style=\"--t:0;--o:0.18s\"/>\u003ccircle class=\"a dot\" cx=\"68\" cy=\"66\" r=\"4\" style=\"--t:0;--o:0.22s\"/>\u003ccircle class=\"a dot\" cx=\"82\" cy=\"58\" r=\"4\" style=\"--t:0;--o:0.26s\"/>\u003ccircle class=\"a dot\" cx=\"96\" cy=\"64\" r=\"4\" style=\"--t:0;--o:0.30000000000000004s\"/>\u003ccircle class=\"a dot\" cx=\"110\" cy=\"52\" r=\"4\" style=\"--t:0;--o:0.33999999999999997s\"/>\u003ccircle class=\"a dot\" cx=\"124\" cy=\"42\" r=\"4\" style=\"--t:0;--o:0.38s\"/>\u003ccircle class=\"a dot\" cx=\"138\" cy=\"46\" r=\"4\" style=\"--t:0;--o:0.42000000000000004s\"/>\u003cpath class=\"a ln s d\" d=\"M20 76 L134 62\" pathLength=\"1\" style=\"--t:0;--o:0.6s\"/>\u003ctext class=\"a mid lb s\" x=\"79\" y=\"136\" style=\"--t:0;--o:0.8s\">high bias\u003c/text>\u003cpath class=\"a ln\" d=\"M152 16 V112 H282\" pathLength=\"1\" style=\"--t:1\"/>\u003ccircle class=\"a dot\" cx=\"164\" cy=\"98\" r=\"4\" style=\"--t:1;--o:0.1s\"/>\u003ccircle class=\"a dot\" cx=\"178\" cy=\"84\" r=\"4\" style=\"--t:1;--o:0.14s\"/>\u003ccircle class=\"a dot\" cx=\"192\" cy=\"74\" r=\"4\" style=\"--t:1;--o:0.18s\"/>\u003ccircle class=\"a dot\" cx=\"206\" cy=\"66\" r=\"4\" style=\"--t:1;--o:0 :0.5s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M186 126 L202 126 M195.0 122.2 L202 126 L195.0 129.8\"/>\u003c/g>\u003crect class=\"a bx\" x=\"206\" y=\"110\" width=\"76\" height=\"32\" rx=\"16\" style=\"--t:1;--o:0.6s\"/>\u003ctext class=\"a mid lb\" x=\"244\" y=\"131\" style=\"--t:1;--o:0.6s\">model\u003c/text>\u003crect class=\"a bx\" x=\"14\" y=\"180\" width=\"64\" height=\"30\" rx=\"15\" style=\"--t:2\"/>\u003ctext class=\"a mid \" x=\"46\" y=\"200\" style=\"--t:2\">KMS\u003c/text>\u003crect class=\"a bx\" x=\"84\" y=\"180\" width=\"56\" height=\"30\" rx=\"15\" style=\"--t:2;--o:0.15s\"/>\u003ctext class=\"a mid \" x=\"112\" y=\"200\" style=\"--t:2;--o:0.15s\">TLS\u003c/text>\u003crect class=\"a bx\" x=\"146\" y=\"180\" width=\"72\" height=\"30\" rx=\"15\" style=\"--t:2;--o:0.3s\"/>\u003ctext class=\"a mid \" x=\"182\" y=\"200\" style=\"--t:2;--o:0.3s\">Macie\u003c/text>\u003crect class=\"a bx\" x=\"224\" y=\"180\" width=\"108\" height=\"30\" rx=\"15\" style=\"--t:2;--o:0.44999999999999996s\"/>\u003ctext class=\"a mid \" x=\"278\" y=\"200\" style=\"--t:2;--o:0.44999999999999996s\">PrivateLink\u003c/text>\u003crect class=\"a bx m\" x=\"14\" y=\"224\" width=\"168\" height=\"30\" rx=\"15\" style=\"--t:3\"/>\u003ctext class=\"a mid lb m\" x=\"98\" y=\"244\" style=\"--t:3\">AgentCore Identity\u003c/text>\u003crect class=\"a bx m\" x=\"190\" y=\"224\" width=\"176\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.3s\"/>\u003ctext class=\"a mid lb m\" x=\"278\" y=\"244\" style=\"--t:3;--o:0.3s\">Policy in AgentCore\u003c/text>\u003cg class=\"a\" style=\"--t:4;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M286 126 L302 126 M295.0 122.2 L302 126 L295.0 129.8\"/>\u003c/g>\u003crect class=\"a bx m\" x=\"306\" y=\"110\" width=\"120\" height=\"32\" rx=\"16\" style=\"--t:4;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"366\" y=\"131\" style=\"--t:4;--o:0.2s\">Guardrails\u003c/text>\u003ctext class=\"a mid lb m\" x=\"366\" y=\"162\" style=\"--t:4;--o:0.4s\">what is said?\u003c/text>"},"data-lineage":{"h":236,"steps":["Lineage is the family tree of your data: where it came from, what was done to it, and which model learned from it.","When a prediction looks wrong, lineage lets you trace it back to the data that caused it.","A data catalogue is the library index: what each dataset is, where it lives and who owns it (AWS Glue Data Catalog).","Secure data engineering: check quality, control access (Lake Formation), mask personal data, and prove nothing was tampered with."],"svg":"\u003crect class=\"a bx\" x=\"14\" y=\"18\" width=\"92\" height=\"30\" rx=\"15\" style=\"--t:0\"/>\u003ctext class=\"a mid \" x=\"60\" y=\"38\" style=\"--t:0\">source A\u003c/text>\u003crect class=\"a bx\" x=\"14\" y=\"62\" width=\"92\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.1s\"/>\u003ctext class=\"a mid \" x=\"60\" y=\"82\" style=\"--t:0;--o:0.1s\">source B\u003c/text>\u003cpath class=\"a ln\" d=\"M106 33 L126 50 M106 77 L126 60\" pathLength=\"1\" style=\"--t:0;--o:0.3s\"/>\u003crect class=\"a bx\" x=\"130\" y=\"40\" width=\"84\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.4s\"/>\u003ctext class=\"a mid \" x=\"172\" y=\"60\" style=\"--t:0;--o:0.4s\">cleaned\u003c/text>\u003cg class=\"a\" style=\"--t:0;--o:0.6s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M218 55 L236 55 M229.0 51.2 L236 55 L229.0 58.8\"/>\u003c/g>\u003crect class=\"a bx\" x=\"240\" y=\"40\" width=\"110\" height=\"30\" rx=\"15\" style=\"--t:0;--o:0.7s\"/>\u003ctext class=\"a mid \" x=\"295\" y=\"60\" style=\"--t:0;--o:0.7s\">training set\u003c/text>\u003cg class=\"a\" style=\"--t:0;--o:0.9s;--x:-10px;--y:0px\">\u003cpath class=\"ln \" d=\"M354 55 L368 55 M361.0 51.2 L368 55 L361.0 58.8\"/>\u003c/g>\u003crect class=\"a bx m\" x=\"372\" y=\"40\" width=\"60\" height=\"30\" rx=\"15\" style=\"--t:0;--o:1s\"/>\u003ctext class=\"a mid lb m\" x=\"402\" y=\"60\" style=\"--t:0;--o:1s\">model\u003c/text>\u003ccircle class=\"a dot s g\" cx=\"402\" cy=\"112\" r=\"8\" style=\"--t:1\"/>\u003ctext you own.","Data governance adds rules on retention, residency, logging and the data lifecycle."],"svg":"\u003ctext class=\"a end\" x=\"222\" y=\"27\" style=\"--t:0;--x:-14px;--y:0px\">who called this API?\u003c/text>\u003crect class=\"a bx m\" x=\"232\" y=\"8\" width=\"196\" height=\"28\" rx=\"14\" style=\"--t:0;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"330\" y=\"27\" style=\"--t:0;--o:0.2s\">AWS CloudTrail\u003c/text>\u003ctext class=\"a end\" x=\"222\" y=\"63\" style=\"--t:0;--o:0.5s;--x:-14px;--y:0px\">still set up right?\u003c/text>\u003crect class=\"a bx m\" x=\"232\" y=\"44\" width=\"196\" height=\"28\" rx=\"14\" style=\"--t:0;--o:0.7s\"/>\u003ctext class=\"a mid lb m\" x=\"330\" y=\"63\" style=\"--t:0;--o:0.7s\">AWS Config\u003c/text>\u003ctext class=\"a end\" x=\"222\" y=\"99\" style=\"--t:1;--x:-14px;--y:0px\">is it vulnerable?\u003c/text>\u003crect class=\"a bx m\" x=\"232\" y=\"80\" width=\"196\" height=\"28\" rx=\"14\" style=\"--t:1;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"330\" y=\"99\" style=\"--t:1;--o:0.2s\">Amazon Inspector\u003c/text>\u003ctext class=\"a end\" x=\"222\" y=\"135\" style=\"--t:1;--o:0.5s;--x:-14px;--y:0px\">AWS’s own reports?\u003c/text>\u003crect class=\"a bx m\" x=\"232\" y=\"116\" width=\"196\" height=\"28\" rx=\"14\" style=\"--t:1;--o:0.7s\"/>\u003ctext class=\"a mid lb m\" x=\"330\" y=\"135\" style=\"--t:1;--o:0.7s\">AWS Artifact\u003c/text>\u003ctext class=\"a end\" x=\"222\" y=\"171\" style=\"--t:2;--x:-14px;--y:0px\">best practice?\u003c/text>\u003crect class=\"a bx m\" x=\"232\" y=\"152\" width=\"196\" height=\"28\" rx=\"14\" style=\"--t:2;--o:0.2s\"/>\u003ctext class=\"a mid lb m\" x=\"330\" y=\"171\" style=\"--t:2;--o:0.2s\">Trusted Advisor\u003c/text>\u003ctext class=\"a mid lb\" x=\"94\" y=\"204\" style=\"--t:3\">buy\u003c/text>\u003ctext class=\"a mid lb m\" x=\"306\" y=\"204\" style=\"--t:3\">build\u003c/text>\u003crect class=\"a bx\" x=\"14\" y=\"212\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.2s\"/>\u003ctext class=\"a mid \" x=\"53\" y=\"232\" style=\"--t:3;--o:0.2s\">Scope 1\u003c/text>\u003crect class=\"a bx\" x=\"98\" y=\"212\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.32s\"/>\u003ctext class=\"a mid \" x=\"137\" y=\"232\" style=\"--t:3;--o:0.32s\">Scope 2\u003c/text>\u003crect class=\"a bx m\" x=\"182\" y=\"212\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.44s\"/>\u003ctext class=\"a mid lb m\" x=\"221\" y=\"232\" style=\"--t:3;--o:0.44s\">Scope 3\u003c/text>\u003crect class=\"a bx m\" x=\"266\" y=\"212\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.56s\"/>\u003ctext class=\"a mid lb m\" x=\"305\" y=\"232\" style=\"--t:3;--o:0.56s\">Scope 4\u003c/text>\u003crect class=\"a bx m\" x=\"350\" y=\"212\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:3;--o:0.6799999999999999s\"/>\u003ctext class=\"a mid lb m\" x=\"389\" y=\"232\" style=\"--t:3;--o:0.6799999999999999s\">Scope 5\u003c/text>\u003cg class=\"a\" style=\"--t:3;--o:0.9s;--x:-10px;--y:0px\">\u003cpath class=\"ln m\" d=\"M14 254 L426 254 M419.0 250.2 L426 254 L419.0 257.8\"/>\u003c/g>\u003crect class=\"a bx\" x=\"14\" y=\"264\" width=\"90\" height=\"30\" rx=\"15\" style=\"--t:4\"/>\u003ctext class=\"a mid \" x=\"59\" y=\"284\" style=\"--t:4\">retention\u003c/text>\u003crect class=\"a bx\" x=\"110\" y=\"264\" width=\"92\" height=\"30\" rx=\"15\" style=\"--t:4;--o:0.15s\"/>\u003ctext class=\"a mid \" x=\"156\" y=\"284\" style=\"--t:4;--o:0.15s\">residency\u003c/text>\u003crect class=\"a bx\" x=\"208\" y=\"264\" width=\"78\" height=\"30\" rx=\"15\" style=\"--t:4;--o:0.3s\"/>\u003ctext class=\"a mid \" x=\"247\" y=\"284\" style=\"--t:4;--o:0.3s\">logging\u003c/text>\u003crect class=\"a bx\" x=\"292\" y=\"264\" width=\"88\" height=\"30\" rx=\"15\" style=\"--t:4;--o:0.44999999999999996s\"/>\u003ctext class=\"a mid \" x=\"336\" y=\"284\" style=\"--t:4;--o:0.44999999999999996s\">lifecycle\u003c/text>"}},"domains":{"1":["Fundamentals of AI and ML",20],"2":["Fundamentals of generative AI",24],"3":["Applications of foundation models",28],"4":["Guidelines for responsible AI",14],"5":["Security, compliance and governance",14]},"segs":[["AI, ML, deep learning, GenAI and agentic AI. AI: any machine doing something we would call smart, even rules a person wrote by hand.","Machine learning sits inside: it learns the rules from examples instead.","Deep learning sits inside that: neural networks with many layers, good at images, speech and language.","Generative AI sits inside deep learning: models that make new text, images or code.","Agentic AI is generative AI put in a loop: it plans, calls tools, checks the result and repeats.","Remember. Boxes inside boxes: AI ⊃ ML ⊃ deep learning ⊃ GenAI. Agentic = GenAI that takes actions."],["Supervised, unsupervised and reinforcement learning. Supervised: every example arrives with its answer (the coloured tag), and the model learns to give that answer.","Unsupervised: no answers at all; the model finds the groups by itself.","Reinforcement: an agent acts, the world scores it, and it learns what earns points.","RLHF is reinforcement where the points are people’s ratings of answers.","Remember. Answer key = supervised. No key, find groups = unsupervised. Points for good moves = reinforcement."],["Types of data: labelled, structured, time-series and more. Structured data fits a table of rows and columns, like a spreadsheet of orders.","Unstructured data is everything else: text, images, audio and video. Most company data is like this.","Time-series data is a value measured over time, so the order matters.","Labelled data has the answer attached, usually added by a person, which is why labels cost money.","Remember. Table = structured. Everything else (text, image, audio) = unstructured. Clock in the data = time-series."],["Inference types: real-time, batch, asynchronous, serverless. Real-time: someone is waiting, so a live endpoint answers in milliseconds.","Batch: a whole dataset is scored offline, and no endpoint stays up.","Asynchronous: big or slow requests wait in a queue, and you are told when each is done.","Serverless: nothing runs between requests. Cheap for rare traffic, but the first call is slow while it wakes up.","Remember. Waiting customer = real-time. Overnight pile = batch. Big job, call me later = async. Rare traffic, pay per use = serverless."],["When AI fits, when it does not, and which technique. The answer is a number, like a house price: regression.","The answer is a category, like fraud or not, or churn yes or no: classification.","You want groups nobody has labelled, like customer segments: clustering.","It must be exact every time, like tax from a fixed rate table: use a plain rule, not ML.","Remember. Number → regression. Category → classification. Hidden groups → clustering. Must be exact → no ML."],["AWS managed AI services (no ML expertise needed). Speech: Transcribe writes down what is said; Polly reads text aloud.","Documents: Textract reads scanned paper; Comprehend understands text you already have.","Pictures and languages: Rekognition looks at images; Translate converts one language to another.","Conversations and shopping: Lex works out what a user wants; Personalize recommends the next item.","Remember. TranSCRIBE writes down what you say; POLLY the parrot speaks. Textract reads paper; Rekognition looks at pictures; Comprehend understands text."],["Traditional ML or a foundation model?. Two kinds of model, built for two kinds of job.","A neat table, huge volume, and every decision must be explained: a small traditional model.","Messy text or images, many different tasks, few labels: a foundation model.","Or both together: the foundation model pulls fields out of documents, and the traditional model scores them.","Remember. Neat table + must explain + millions per second → traditional ML. Messy language + many tasks → foundation model."],["The ML pipeline, stage by stage, with the AWS service for each. Start with the business goal, then collect the data (Amazon S3, AWS Glue).","Clean it (Glue DataBrew, Data Wrangler) and shape it into features (Feature Store).","Train and tune it (SageMaker AI), then evaluate it on data it never saw.","Deploy it behind an endpoint or a managed API, and monitor it (Model Monitor).","When the world changes, monitoring triggers retraining. It is a loop, not a line.","Remember. Goal → data → clean → features → train → evaluate → deploy → monitor → retrain. A loop, not a line."],["MLOps: making ML repeatable. MLOps puts training and deployment in one automated pipeline (SageMaker Pipelines).","Every run repeats the same steps, so any model version can be rebuilt.","In production, Model Monitor watches quality against a threshold.","Customer behaviour shifts and accuracy slides below the line: that is drift.","The drop triggers retraining, and the new model goes back through the same pipeline.","Remember. MLOps = the model ships the same way every time, and someone notices when it goes stale."],["Model metrics and business metrics. Twenty payments, four of them fraud. When one outcome is rare, accuracy misleads.","A model that always says “not fraud” is 80% accurate and catches nothing.","A better model flags five. Precision: 3 of its 5 flags were fraud. Recall: it caught 3 of the 4 frauds.","One fraud slipped through. When a miss is costly, push recall up and accept more false alarms.","Remember. Precision = “when I shout fire, is there fire?” Recall = “did I catch every fire?”"],["Tokens, chunking, embeddings and vectors. A model reads tokens, sub-word pieces, not words. Prices and limits are counted in tokens.","An embedding turns a piece of text into a vector: a point whose position captures its meaning.","Similar meanings land close together, so a search for “money back” finds the refund policy.","Chunking cuts a long document into pieces before embedding, so search returns one paragraph, not a whole manual.","Remember. Tokens are what you pay for. Embeddings are meaning as coordinates. Chunks are bite-size pieces you can find."],["Transformers, foundation models, multimodal and diffusion models. A transformer reads the whole passage at once and works out which words matter to which. That is attention.","A foundation model is pre-trained once on huge general data, then adapted to many tasks.","A multimodal model takes more than one kind of input or output, like a photo plus a question.","A diffusion model starts from random noise and removes it step by step until a picture appears.","Remember. Transformer = attention to every word at once. Diffusion = sculpt a picture out of static."],["The foundation model lifecycle. Choose the data, then the model design.","Pre-train it on a massive amount of unlabelled data. That costs millions, so few companies ever do it.","Fine-tune it for a narrower job, evaluate it, then deploy it.","Collect feedback (ratings, human review), which feeds the next round of tuning.","Most companies start from an existing model and join at fine-tuning or later.","Remember. Data → model → pre-train → fine-tune → evaluate → deploy → feedback. You usually join at step 4 or later."],["What GenAI is good and bad at, and how to choose a model. Strengths: one model adapts to many jobs, talks naturally and creates new content.","Weakness: it can hallucinate, stating false things confidently.","It is also nondeterministic (the same question can get a different answer), and it cannot explain why it answered as it did.","Choosing a model is a trade-off: modality, latency, cost, context length, compliance and language.","Remember. Pros: adaptable, conversational, creative. Cons: hallucinates, changes its answer, cannot explain itself."],["Token pricing and the cost trade-offs of AWS GenAI. You pay for input tokens (what you send) and output tokens (what comes back). Output usually costs more.","On-demand is a taxi meter: pay only for the tokens you use. It fits low or spiky traffic.","Provisioned Throughput is a leased car: reserved capacity billed by the hour, used or not.","Batch is a freight train: cheaper per token for big jobs where nobody waits.","Prompt caching: a long prefix sent with every request is read from cache, which is cheaper and faster.","Remember. On-demand = taxi meter. Provisioned throughput = leased car. Batch = freight train, cheap but slow."],["The AWS GenAI stack: Bedrock, SageMaker, JumpStart, Nova, Quick, Kiro, Strands, AgentCore. A ready foundation model behind an API, no servers: Amazon Bedrock. Building and hosting your own model: SageMaker AI.","A pre-trained model deployed into your account in a few clicks: SageMaker JumpStart. Amazon’s own models: Nova.","A business analyst working with data: Amazon Quick. A developer building software: Kiro.","Writing an agent in code: Strands Agents. Running agents securely in production: Bedrock AgentCore.","Remember. Bedrock = rent a model by the token. SageMaker = run your own. JumpStart = SageMaker’s model shelf. AgentCore = where agents live in production."],["Agents, tools, memory, MCP and context engineering. An agent gets a goal, reasons about the next step and picks a tool.","It calls the tool, looks at the result and repeats until the goal is met or a stop rule fires.","MCP is a standard plug: any agent can reach any tool or data source the same way.","Memory keeps earlier steps and conversations: short-term for this session, long-term across sessions.","Context engineering decides what fills the model’s limited window each step: instructions, facts, tool results, history.","Remember. Agent = model + tools + loop + memory. MCP = USB for tools. Context engineering = packing the model’s suitcase well."],["Choosing an FM and setting temperature, top-p and length. Pick a model like a vehicle: what it costs, what it can take in, how fast it is, its languages and how much text it holds.","Temperature is a creativity dial. Low gives consistent, predictable wording, good for facts and support.","High gives varied, surprising answers, good for brainstorming slogans.","Neither setting makes an answer true. Accuracy comes from better context, not the dial.","Max tokens caps how long the answer can be, which also caps its cost; a stop sequence says where to stop.","Remember. Temperature low = librarian. Temperature high = poet."],["RAG, Bedrock Knowledge Bases and vector databases. Before any question: documents are cut into chunks, embedded, and stored in a vector database.","A question arrives and is embedded the same way.","The nearest chunks are retrieved and added to the prompt.","The model answers from your documents and cites them.","When documents change, sync the knowledge base so the index updates. No retraining.","Remember. RAG = open-book exam. Fresh documents, no retraining, answers with citations."],["The customisation cost ladder: prompt, RAG, fine-tune, continued pre-train, pre-train, distil. The bottom rungs change no weights: better prompts, then RAG with your documents.","Fine-tuning retrains the model a little on labelled prompt and response pairs.","Continued pre-training feeds it a mountain of unlabelled text from your field.","Pre-training from scratch builds your own model. Each rung up costs more time, money and data, so climb only as far as you must.","Distillation is a side door: a large teacher model’s answers train a small, cheap student.","Remember. Climb the ladder only as far as you must: prompt → RAG → fine-tune → continued pre-train → pre-train. The ladder ranks up-front effort, not every monthly bill."],["Fine-tuning methods and preparing the data. Instruction tuning: many “request, then a great answer” pairs teach the model to follow instructions.","Domain adaptation and transfer learning reuse what a model already knows and adjust it for a new field.","Good training data is curated, labelled, big enough, representative of real users, and allowed to be used.","A small, clean, representative set beats a big noisy one.","Remember. Good fine-tuning data is CLEAN: Curated, Labelled, Enough, Accurate-to-real-users, Not-secret."],["Prompt engineering techniques and Bedrock Prompt Management. A good prompt has parts: the instruction, the context, the input data and the output format.","Zero-shot: just ask. One-shot: show one example first. Few-shot: show several.","Chain-of-thought: ask the model to reason step by step before it answers.","Examples in the prompt are in-context learning: nothing is retrained, and the weights do not change.","Prompt Management keeps prompts as versions: edit the draft, ship a tested version, roll back if it gets worse.","Remember. Zero = just ask. One = show one. Few = show several. Chain-of-thought = “think step by step”."],["Prompt risks: injection, hijacking, jailbreaking, poisoning, exposure. Prompt injection hides orders in the input or in a document the model reads. If it works, the model is hijacked and serves the attacker.","Jailbreaking talks the model past its safety rules, often through role-play.","Poisoning taints the training or retrieval data, so the model learns or repeats something wrong.","Exposure, or leaking: the model reveals its hidden instructions or private data.","Defences: Bedrock Guardrails, input checks, least-privilege tools, and keeping instructions separate from data.","Remember. Injection sneaks in orders. Jailbreak talks past the rules. Poisoning taints the food. Exposure spills the secrets."],["Evaluating FMs: humans, benchmarks, ROUGE, BLEU, BERTScore, LLM-as-a-judge. Three ways to grade a model: people review the answers, a benchmark test set, or another model acting as judge.","ROUGE asks how much of the reference the output covered. It is the summary metric.","BLEU asks how much of the output matches the reference wording. It is the translation metric.","BERTScore compares meaning rather than exact words, so a good paraphrase still scores well.","Then the business asks: is the task done, are users happy, and what does each interaction cost?","Remember. ROUGE for Resumés (summaries), BLEU for Bilingual (translation), BERTScore for meaning."],["Responsible AI, Bedrock Guardrails and the legal risks. Responsible AI means the system is fair, safe, truthful, robust, open about itself, and governed by people who answer for it.","Amazon Bedrock Guardrails sit on both sides of the model, checking what goes in and what comes out.","They block topics you name, filter harmful content and prompt attacks, and mask personal data.","A contextual grounding check asks whether the answer is supported by the source. It does not prove the source is true.","The legal risks: copyright claims, biased outputs, hallucinated claims and lost customer trust.","Remember. Guardrails = topic bouncer + profanity filter + PII blur + source-support check, around any model."],["Bias, variance, datasets and detecting bias. High bias is underfitting: the model is too simple and misses the pattern.","High variance is overfitting: it memorises the noise, perfect on training data and poor on new data.","A good fit follows the pattern and ignores the noise.","Bias in the fairness sense starts with the data: a dataset that is mostly one group teaches the model to favour that group.","Catch it by testing each group separately, checking label quality and auditing outputs. SageMaker Clarify measures bias.","Remember. High bias = underfit (too simple). High variance = overfit (memorised). Unfair bias = bad data in, unfair answers out."],["Transparent and explainable models. A transparent model shows its reasoning: you can read a decision tree’s questions.","An opaque model, such as a deep network or an FM, is a black box, but tools can still show which inputs pushed a decision.","The most accurate models are often the hardest to explain, so a bank may give up a little accuracy for a lot of explanation.","Documentation is transparency too: SageMaker Model Cards record what a model is for, how it was trained and its risks.","Good design tells users when AI made a decision and gives them a way to contest it.","Remember. Transparent = glass box. Explainable = black box with a good witness."],["Securing AI systems on AWS. Shared responsibility: AWS secures the hardware, buildings and the managed service; you secure your data, access and configuration.","IAM decides who and what may call a model or read data, always with the least access needed.","KMS encrypts data at rest and TLS in transit; Macie finds personal data in S3; PrivateLink keeps traffic off the public internet.","For agents, AgentCore Identity sets whose credentials it uses, and Policy in AgentCore sets which tool actions are allowed.","Guardrails filter what goes in and what is said. Each layer answers a different question.","Remember. IAM = who. KMS = locked. Macie = find the secrets in S3. PrivateLink = private road. Guardrails = what is said."],["Data lineage, cataloguing and secure data engineering. Lineage is the family tree of your data: where it came from, what was done to it, and which model learned from it.","When a prediction looks wrong, lineage lets you trace it back to the data that caused it.","A data catalogue is the library index: what each dataset is, where it lives and who owns it (AWS Glue Data Catalog).","Secure data engineering: check quality, control access (Lake Formation), mask personal data, and prove nothing was tampered with.","Remember. Lineage = the family tree. Catalogue = the library index. Cite your sources like a good essay."],["Governance and compliance: Config, Inspector, Artifact, CloudTrail, Trusted Advisor. Who called which API, and when? AWS CloudTrail. Is everything still set up the way our rules say? AWS Config.","Are our servers and containers vulnerable? Amazon Inspector. Where are AWS’s own compliance reports? AWS Artifact.","Are we following best practice on cost and security? AWS Trusted Advisor.","The Generative AI Security Scoping Matrix: Scopes 1–2 buy a GenAI product, Scopes 3–5 build. The more you own, the more security you own.","Data governance adds rules on retention, residency, logging and the data lifecycle.","Remember. CloudTrail = who did it. Config = is it still set right. Inspector = is it vulnerable. Artifact = AWS’s paperwork. Trusted Advisor = best-practice checklist."]],"audio":{"ai-nesting":["/audio/aif-c01/ai-nesting-0-20f9a8c658.mp3","/audio/aif-c01/ai-nesting-1-7455e3a6bb.mp3","/audio/aif-c01/ai-nesting-2-75dc85c213.mp3","/audio/aif-c01/ai-nesting-3-27bd7b2b4d.mp3","/audio/aif-c01/ai-nesting-4-4aafd81742.mp3","/audio/aif-c01/ai-nesting-5-c4f32cabb6.mp3"],"learning-types":["/audio/aif-c01/learning-types-0-bd6aa14928.mp3","/audio/aif-c01/learning-types-1-3f50e92a9d.mp3","/audio/aif-c01/learning-types-2-e72229f663.mp3","/audio/aif-c01/learning-types-3-fc4e1bdc6a.mp3","/audio/aif-c01/learning-types-4-785bdbf140.mp3"],"data-types":["/audio/aif-c01/data-types-0-1ed4bf991c.mp3","/audio/aif-c01/data-types-1-38ac0b7ef6.mp3","/audio/aif-c01/data-types-2-859bccd5c9.mp3","/audio/aif-c01/data-types-3-cc8e0281b2.mp3","/audio/aif-c01/data-types-4-08100ce90b.mp3"],"inference-types":["/audio/aif-c01/inference-types-0-2f886cea61.mp3","/audio/aif-c01/inference-types-1-2072e7f3c3.mp3","/audio/aif-c01/inference-types-2-57059f8e89.mp3","/audio/aif-c01/inference-types-3-7fbb3c76da.mp3","/audio/aif-c01/inference-types-4-2dc0106364.mp3"],"use-cases":["/audio/aif-c01/use-cases-0-d0e7088ed7.mp3","/audio/aif-c01/use-cases-1-9b8c7f12af.mp3","/audio/aif-c01/use-cases-2-4282362898.mp3","/audio/aif-c01/use-cases-3-39c56b1254.mp3","/audio/aif-c01/use-cases-4-d2a7e489fe.mp3"],"aws-ai-services":["/audio/aif-c01/aws-ai-services-0-e3fe7ae83e.mp3","/audio/aif-c01/aws-ai-services-1-66e39ce83f.mp3","/audio/aif-c01/aws-ai-services-2-904ba8dd9f.mp3","/audio/aif-c01/aws-ai-services-3-c86912c828.mp3","/audio/aif-c01/aws-ai-services-4-3b2e72d005.mp3"],"trad-ml-vs-fm":["/audio/aif-c01/trad-ml-vs-fm-0-eeaec10bb9.mp3","/audio/aif-c01/trad-ml-vs-fm-1-fa6bbfed06.mp3"     <div class="meta"><span>Domain ${t.d} &middot; ${esc(DOMS[t.d][0])}</span><span class="num">${String(i+1).padStart(2,'0')} / ${T.length}</span></div>
    <h2>${esc(t.title)}</h2>
    <figure class="mo"><svg viewBox="0 0 440 ${m.h}" aria-hidden="true" focusable="false">${m.svg}</svg></figure>
    <div class="seg" aria-hidden="true">${m.steps.map(() => '<i></i>').join('')}<i></i></div>
    <p class="cap" aria-live="polite"></p>
    <p class="hk"></p>
    <div class="acts"><button class="btn" type="button" data-act="pause">Pause</button><button class="btn" type="button" data-act="replay">Replay</button>
      <a class="btn" href="/aws-ai-practitioner#t-${t.id}">Read the topic</a><button class="btn" type="button" data-act="link">Copy link</button></div>
  </div></article>`;
});
html += `<section class="reel" id="end"><div class="card plain">
  <h1>That&rsquo;s all thirty.</h1>
  <p>Now test yourself: the study page has 57 practice questions and two timed 65-question mocks.</p>
  <div class="row"><a class="btn go" href="/aws-ai-practitioner#console">Practise questions</a><button class="btn" type="button" data-jump="intro">Back to the start</button></div>
</div></section>`;
$('#feed').innerHTML = html;
// group each diagram's elements by the step they belong to, once
const steps = new Map();
$$('article.reel').forEach(r => {
  const by = []; $$('.a', r).forEach(el => { const k = +el.style.getPropertyValue('--t') || 0; (by[k] = by[k] || []).push(el); });
  steps.set(r, by);
});

// ---------- the player ----------
// one reel plays at a time; a token cancels anything a superseded run still has pending
const P = { sound: false, auto: true, cur: null, tok: 0, paused: false, at: 0 };
let voice = null;
function pickVoice(){
  if (!canSpeak) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
  voice = vs.find(v => /natural|neural|google|samantha|daniel|serena/i.test(v.name)) || vs.find(v => v.localService) || vs[0] || null;
}
if (canSpeak) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// recorded narration (Kokoro clips) plays through one reused element: iOS unlocks an element
// once inside a tap, and every later play() on that same element is then allowed
const player = new Audio(); player.preload = 'auto';
const clipsOf = (r) => DATA.audio[T[+r.dataset.i].id] || [];
const firstClip = Object.values(DATA.audio).flat().find(Boolean) || null;
if (!canSpeak && !firstClip) { $('#sound').disabled = true; $('#sound').title = 'This browser cannot read aloud'; $('#start-sound').hidden = true; }
function prefetch(r){ if (r) clipsOf(r).forEach(u => { if (u) { const a = new Audio(); a.preload = 'auto'; a.src = u; } }); }
const readTime = (s) => Math.min(7500, Math.max(2600, s.length * 58));
const lastStep = (r) => DATA.motion[T[+r.dataset.i].id].steps.length - 1;
function speak(text, fin){
  if (!canSpeak) { sleep(readTime(text)).then(fin); return; }
  const u = new SpeechSynthesisUtterance(text); if (voice) u.voice = voice; u.rate = 1.02; u.onend = fin; u.onerror = fin;
  speechSynthesis.speak(u);
}
// a recorded clip when there is one, the browser's voice when not, silence when sound is off;
// a timer backs up every path, because some engines never fire their end event
function say(text, tok, src){
  if (!P.sound) return sleep(readTime(text));
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; player.onended = player.onerror = null; res(); } };
    setTimeout(fin, readTime(text) * 2 + 4000);
    if (src) {
      player.onended = fin; player.onerror = () => { player.onerror = null; speak(text, fin); };
      player.src = src; player.play().catch(() => speak(text, fin));
    } else speak(text, fin);
  }).then(() => sleep(tok === P.tok ? 320 : 0));
}
function show(r, k, instant){
  (steps.get(r)[k] || []).forEach(el => { el.classList.add('on'); el.classList.toggle('now', !!instant); });
  $$('.seg i', r).forEach((s, j) => s.classList.toggle('on', j <= k));
}
function reset(r){
  $$('.a', r).forEach(el => el.classList.remove('on', 'now'));
  $$('.seg i', r).forEach(s => s.classList.remove('on'));
  $('.cap', r).textContent = ''; $('.hk', r).textContent = '';
}
function halt(){ P.tok++; if (canSpeak) speechSynthesis.cancel(); player.onended = player.onerror = null; player.pause(); }
async function play(r, from = 0){
  halt(); const tok = P.tok; P.cur = r; P.paused = false; P.at = from;
  $('[data-act="pause"]', r).textContent = 'Pause';
  const t = T[+r.dataset.i], m = DATA.motion[t.id];
  reset(r);
  for (let k = 0; k < from; k++) show(r, k, true);
  const clips = clipsOf(r); prefetch(r.nextElementSibling);
  if (canSpeak && P.sound && !clips[from]) await sleep(80);   // Chrome drops a speak() issued straight after cancel()
  for (let k = from; k < m.steps.length; k++) {
    if (tok !== P.tok) return;
    P.at = k; show(r, k, false); $('.cap', r).textContent = m.steps[k];
    await say(DATA.segs[+r.dataset.i][k], tok, clips[k]);
  }
  if (tok !== P.tok) return;
  P.at = m.steps.length;
  $$('.seg i', r).forEach(s => s.classList.add('on'));
  $('.hk', r).textContent = t.hook;
  await say(DATA.segs[+r.dataset.i][m.steps.length], tok, clips[m.steps.length]);
  if (tok !== P.tok || !P.auto) return;
  await sleep(700);
  if (tok === P.tok) go(r.nextElementSibling);
}
function pause(r){
  if (P.cur !== r) return;
  if (P.paused) { play(r, Math.min(P.at, lastStep(r))); return; }
  halt(); P.paused = true; $('[data-act="pause"]', r).textContent = 'Play';
}
function go(el){ if (el) el.scrollIntoView({behavior: reduced() ? 'auto' : 'smooth', block: 'start'}); }

// play whichever reel fills the screen; leaving a reel stops it
const io = new IntersectionObserver((es) => {
  for (const e of es) {
    if (!e.isIntersecting) continue;
    const r = e.target;
    if (r.matches('article.reel')) { if (P.cur !== r) play(r); }
    else { halt(); P.cur = null; }
    history.replaceState(null, '', '#' + r.id);
  }
}, { root: $('#feed'), threshold: 0.6 });
$$('.reel').forEach(r => io.observe(r));

// iOS only lets speech start inside a tap, so a tap that turns sound on also speaks once, silently
function soundOn(on){
  P.sound = on && (canSpeak || !!firstClip); $('#sound').setAttribute('aria-pressed', P.sound);
  if (P.sound && canSpeak) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); }
  // no reel is playing yet (the intro's Start button): unlock the player now, inside the tap
  if (P.sound && !P.cur && firstClip) {
    const tok = P.tok; player.muted = true; player.src = firstClip;
    player.play().then(() => { if (tok === P.tok) player.pause(); player.muted = false; }).catch(() => { player.muted = false; });
  }
  if (P.cur) play(P.cur, Math.min(P.at, lastStep(P.cur)));
}
$('#sound').addEventListener('click', () => soundOn(!P.sound));
$('#auto').addEventListener('click', e => { P.auto = !P.auto; e.currentTarget.setAttribute('aria-pressed', P.auto); toast(P.auto ? 'Moves to the next reel when one ends.' : 'Stays on each reel until you swipe.'); });
$('#start-sound').addEventListener('click', () => { soundOn(true); go($('article.reel')); });
$('#start-muted').addEventListener('click', () => { soundOn(false); go($('article.reel')); });
$('#feed').addEventListener('click', async e => {
  const j = e.target.closest('[data-jump]'); if (j) { e.preventDefault(); go(j.dataset.jump === 'intro' ? $('#intro') : $('#r-' + j.dataset.jump)); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const r = a.closest('article.reel');
  if (a.dataset.act === 'pause') pause(r);
  if (a.dataset.act === 'replay') play(r, 0);
  if (a.dataset.act === 'link') {
    const url = location.origin + location.pathname + '#' + r.id;
    try { await navigator.clipboard.writeText(url); toast('Link copied.'); } catch(_) { toast(url); }
  }
});
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  const here = P.cur || $('#intro');
  if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'PageDown') { e.preventDefault(); go(here.nextElementSibling); }
  if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'PageUp') { e.preventDefault(); go(here.previousElementSibling); }
  if (e.key === ' ' && P.cur && !e.target.closest('button,a')) { e.preventDefault(); pause(P.cur); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && P.cur && !P.paused) pause(P.cur); });
$('#theme').addEventListener('click', () => {
  let c = document.documentElement.getAttribute('data-theme');
  if (!c) c = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  const n = c === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', n);
  try { localStorage.setItem('gradient_path_theme', n); } catch(e) {}
});
// a shared link opens on its reel
const h = location.hash.slice(1); if (h && document.getElementById(h)) document.getElementById(h).scrollIntoView({block: 'start'});
})();
</script>
</body></html>
