worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # The module pages are 1.7-2.2MB of inlined SVG + pre-rendered KaTeX.
    # Gzip cuts that substantially on the wire -- worth it at this file size.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location / {
            # $uri.html gives every root page a clean URL, e.g. /aws-ai-practitioner
            try_files $uri $uri.html $uri/ =404;
        }

        # Reel narration MP3s carry a hash of their text in the file name, so a changed
        # clip gets a new URL and the old one can be cached for good.
        location /audio/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
